# Install as /etc/systemd/system/tv-passport.service.d/relay-events.conf.
# Cast events for the Passport: the file tv-relay.service writes for its
# --extra-device Passport:<now-playing>:<events>. Without it the Passport never
# switches to "My cast" by itself. Ignored once tenancy.conf sets TV_DB (each
# device's events then live under devices/<id>/).
[Service]
Environment=TV_RELAY_EVENTS_FILE=/var/lib/ai-passport-tv-passport/relay-events.json
