# Install as /etc/systemd/system/tv-passport.service.d/voice.conf.
# Push-to-talk voice control (server/README.md, "Voice control"). Deleting this
# file (and daemon-reload) turns voice off: without TV_ASR_SOCKET the server does
# not offer it in CONFIG. The unit's user must be in the tvserver group (the
# socket) and able to read the relay key file.
[Unit]
# muse-asr owns the socket (muse-asr.service.d/tv-voice.conf); the relay serves
# episodes, playback and search.
After=muse-asr.service tv-relay.service
[Service]
Environment=TV_ASR_SOCKET=/run/muse-asr/asr.sock
Environment=TV_RELAY_KEY_FILE=/etc/ai-passport-tv/relay-key
# Single-user relay only: this unit's device in the relay, the name in tv-relay's --extra-device Passport:... (or its id, d1).
# Ignored once tenancy.conf sets TV_DB; keep it here so a rollback brings it back.
Environment=TV_RELAY_DEVICE=Passport
# Only while tuning the thresholds: recognised words in the log. Off by default;
# comment it out again afterwards.
#Environment=TV_VOICE_LOG_TEXT=1
