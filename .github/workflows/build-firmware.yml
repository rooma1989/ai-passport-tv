name: Build firmware

on:
  push:
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    # One job per board: the two images share nothing at build time, and one
    # failing says nothing about the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          # --prototype, not --firmware. The two build different programs:
          # --firmware uses sdkconfig.defaults alone and produces the upstream
          # BSP demo, while --prototype adds sdkconfig.av-prototype and produces
          # this project's television application. The upstream command was
          # carried over from the template and published the demo under this
          # project's name -- a user who flashed it got the factory demo, not a
          # television. Found by downloading the released image and reading the
          # strings inside it: 26 segments and "FoloToy AI Passport BSP demo",
          # against 40 segments and no demo code in the correct one.
          - board: ai-passport
            target: esp32c3
            mode: --prototype
            built: FoloToy-AI-Passport-prototype-public.bin
          # The Xingzhi Cube 1.54 (ESP32-S3), first-class for self-hosting
          # (design Q9). Same application, its own board settings.
          - board: xingzhi-cube-154
            target: esp32s3
            mode: --xingzhi
            built: Xingzhi-Cube-154-tv-public.bin
    steps:
      # Full history so `git describe` finds the tags: the version below is what
      # the device reports in HELLO and what the admin page compares against.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Firmware version
        id: version
        run: |
          # Printable and shell-safe: it travels into the build container's
          # arguments and into esp_app_desc_t (32 bytes).
          version="$(git describe --tags --always --dirty | tr -cd 'A-Za-z0-9._+-')"
          version="${version:0:32}"
          echo "Firmware version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: ccache-${{ matrix.board }}-${{ github.ref_type }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.board }}-${{ github.ref_type }}-${{ github.ref_name }}-
            ccache-${{ matrix.board }}-

      # A public build (AV_PUBLIC_BUILD=ON inside validate.sh): no private
      # header, no pairing token, no default server, no site. validate.sh
      # refuses to finish otherwise (tools/firmware_manifest.py check-public),
      # so a public release can never point at anyone's server (design Q11).
      - name: Build firmware (ESP-IDF 5.5.3 / ${{ matrix.target }})
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: ${{ matrix.target }}
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
            -e IDF_CCACHE_ENABLE=1
            -e AV_FW_VERSION=${{ steps.version.outputs.version }}
          command: ./tools/validate.sh ${{ matrix.mode }}

      # The image under the name the documentation and the flasher use, beside
      # its manifest. The manifest step re-reads the image: chip id, this
      # project's application at 0x10000, the version just built, and for the
      # Passport an end before the identity region at 0x356000.
      - name: Manifest
        env:
          BOARD: ${{ matrix.board }}
          BUILT: ${{ matrix.built }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 tools/firmware_manifest.py make --board "$BOARD" \
            --image "build/$BUILT" --version "$VERSION" --out-dir dist
          ls -la dist/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware-${{ matrix.board }}
          path: dist/
          if-no-files-found: error

  # Both boards' manifests into the one the web flasher reads, checksums, and a
  # ready-to-serve flasher folder. Runs for manual builds too, so a dispatch
  # shows the whole set before anything is tagged.
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download firmware artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: firmware-*
          path: release
          merge-multiple: true

      # merge re-hashes every image against its manifest and refuses builds of
      # different versions; check re-reads the result the way the flasher will.
      # The bundle is the folder a static site or the household server serves
      # as /flash/: the page, esptool-js, and firmware/ beside it. The page
      # fetches the images from its own origin because GitHub's release
      # downloads send no CORS header (see docs/flash/index.html).
      - name: Manifest, checksums and flasher bundle
        run: |
          python3 tools/firmware_manifest.py merge release
          python3 tools/firmware_manifest.py check release
          python3 tools/firmware_manifest.py bundle release --out flasher/flash
          (cd flasher && zip -qr ../release/xiaozhi-tv-flasher.zip flash)
          cat release/SHA256SUMS
          ls -la release/

      - name: Upload release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware-release-${{ github.ref_type }}-${{ github.run_number }}
          path: release/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with the server workflow's release job, which publishes to the same
    # release for the same tag. A release is updated by reading it and writing it
    # back, so two jobs doing that concurrently lose one side's files; concurrency
    # groups are repository-wide, so the same group name makes them queue instead.
    # cancel-in-progress must stay false -- cancelling a release job halfway is
    # how a published release ends up missing an asset.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Download release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: firmware-release-${{ github.ref_type }}-${{ github.run_number }}
          path: release

      # Named as the documentation tells people to download them: the Passport
      # image is FoloToy-AI-Passport-tv.bin (the README, the manual flashing
      # command and both flashing pages say so), the Xingzhi image
      # Xingzhi-Cube-154-tv-public.bin (its board document). The build job
      # already copied them under these names; listed here so a missing one
      # fails the release instead of publishing half a set.
      - name: List release files
        run: |
          for f in FoloToy-AI-Passport-tv.bin Xingzhi-Cube-154-tv-public.bin \
                   manifest.json manifest-ai-passport.json manifest-xingzhi-cube-154.json \
                   SHA256SUMS xiaozhi-tv-flasher.zip; do
            test -f "release/$f" || { echo "missing release/$f"; exit 1; }
          done
          ls -la release/

      # The page a user lands on when they click the release. Without a body it
      # shows a list of filenames and nothing else -- no indication which one is
      # for their computer, or that flashing the device and running the server
      # are two separate things both needed. Written once, in a file both
      # workflows read, so the firmware job and the server job cannot publish
      # different explanations of the same release.
      - name: Create release (tag push)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "${{ github.ref_name }}"
          # Inline rather than read from a file. The release job does not check
          # out the repository -- it only downloads the built artifacts -- so a
          # body_path pointed at a file that is not there, and the action
          # reported "Failed to read body_path (ENOENT). Falling back to 'body'
          # input", which is to say it published an empty page. The text is the
          # same in both workflows, and keeping it identical matters: whichever
          # job runs second rewrites the release.
          body: |
            ## 下载哪个文件

            先看你要做什么。

            **给设备刷固件** —— 按你的设备下载。都是完整镜像，包含引导程序、分区表和应用程序，从地址 0 一次写完；都是公开版，不带任何服务器地址，配网时填你自己的。

            | 设备 | 下载 |
            | --- | --- |
            | FoloToy AI Passport（ESP32-C3） | `FoloToy-AI-Passport-tv.bin`（**不要擦除**） |
            | 星智 Cube 1.54 / 小智 AI 4G 款（ESP32-S3） | `Xingzhi-Cube-154-tv-public.bin`（第一次刷先整片擦除，替换掉小智 AI 固件） |

            `manifest.json`、`SHA256SUMS` 是给网页刷机用的清单和校验值；`xiaozhi-tv-flasher.zip` 是刷机网页加固件的整套文件，放到任何 https 网站的 `/flash/` 下就能用。

            **让电脑提供电视信号** —— 按你的系统下载：

            | 你的电脑 | 下载 |
            | --- | --- |
            | Windows | `tv-server-windows-amd64.exe` |
            | Mac（M 系列芯片） | `tv-server-macos-arm64.zip` |
            | Linux | `tv-server-linux-x86_64.zip` |

            Mac 和 Linux 下载的是压缩包，**解压后再运行**。压缩包是为了保住"可执行"这个标记——直接传程序文件的话，那个标记会在下载途中丢掉，双击会被系统拒绝。

            两件事都要做：设备刷固件，电脑跑服务。

            ## 怎么用

            **刷固件**：推荐用网页直接刷，不用装软件 —— <https://zpdeng1020-coder.github.io/ai-passport-tv/flash/>

            手动刷的命令：

            ```
            esptool.py --chip esp32c3 --port <你的串口> write_flash 0x0 FoloToy-AI-Passport-tv.bin
            ```

            > **不要使用 `erase-flash`**，那会擦掉设备里出厂写入的身份信息，擦掉找不回来。

            **跑服务**：把下载的文件放进一个空文件夹，双击。电脑上不需要预先装任何东西——程序第一次运行会自己取回缺的视频转换组件。

            **连设备**：设备第一次开机会显示彩条和一个 `FoloToy-XXXX` 网络名。手机连上它，浏览器打开 `192.168.4.1`，填 WiFi 和屏幕上打印的那个地址。

            完整步骤、按键功能、故障排查见仓库首页的 [README](https://github.com/zpdeng1020-coder/ai-passport-tv#readme)。

            ## 这个版本有什么

            - **Windows 兼容性修复 (v1.2.1)**：修复 Windows 平台播放实时电视频道时因匿名管道继承导致的崩溃缺陷，全面改用跨平台回环 TCP 套接字
            - **Web 刷机修复 (v1.2.1)**：修复浏览器端一键刷机页面对新版固件预校验的哈希不匹配问题
            - **画质与流畅度**：320×180 原生 1:1 宽屏点对点，12kB 黄金双包传输，智能边缘滤波与自适应流控
            - **重要提醒**：固件与服务端版本必须保持一致，刷入新固件后请同步下载运行最新版服务端
            - **设备端**：网络电视播放，三个按键完成换台、音量、亮度与选台
            - **配网**：开箱自动进配网；服务器地址可以填主机名，路由器换 IP 之后不受影响
            - **电脑端**：下载一个文件双击即用，不必安装 Python；首次运行自动获取 ffmpeg
            - **频道配置页**：挑选、排序、检测失效；检测区分可用／较慢／失效三态

            ## 常见问题

            **设备显示"连不上服务器"**

            Windows 默认会挡住外面的设备来连。第一次运行时如果弹出防火墙询问，勾上"专用网络"；没弹或点了取消，用管理员 PowerShell 加一条：

            ```powershell
            New-NetFirewallRule -DisplayName "AI Passport TV" -Direction Inbound -Protocol TCP -LocalPort 8096 -Action Allow -Profile Private
            ```

            **Mac 上双击被拦下：「未打开"tv-server-macos-arm64"」**

            不是文件坏了——本项目没有购买代码签名证书，系统认不出来。按这三步走：

            1. 点 **完成**。**不要点「移到废纸篓」**，那是把程序删掉。
            2. 打开 **系统设置 → 隐私与安全性**，往下滑，找到「已阻止"tv-server-macos-arm64"以保护 Mac」。
            3. 点 **仍要打开**，再确认一次。

            **换台要等几秒**

            正常。每换一个台，电脑要重新开始拉流和转换。

            ## 测到什么程度

            如实说明，免得你遇到问题不知道该不该怀疑程序。

            **实际验证过的**：Windows 11 上完整跑通（没装 Python、没装 ffmpeg 的真机器）；macOS 上完整跑通（构建、启动、取流、频道表保存后自动重启）；三个平台的构建由 CI 分别执行，每个平台构建完立刻启动一次做冒烟测试。

            **没有验证的**：Linux 上没有人真的用过（CI 里构建和测试都通过，但那是服务器环境不是桌面）；Intel 芯片的 Mac 没有现成文件，构建机器只有 M 系列芯片。

            **已知会遇到的**：公开的直播源会失效，这是常态不是故障，用配置页的"检测失效"剔掉即可。
          files: |
            release/FoloToy-AI-Passport-tv.bin
            release/Xingzhi-Cube-154-tv-public.bin
            release/manifest*.json
            release/SHA256SUMS
            release/xiaozhi-tv-flasher.zip
          fail_on_unmatched_files: true
