# Multi-user relay (phase 1 of docs/superpowers/specs/2026-10-12-multi-tenant-design.md).
# Install as /etc/systemd/system/tv-relay.service.d/tenancy.conf, then
# `systemctl daemon-reload`. Deleting this file (and daemon-reload) is the
# rollback: the base unit's single-user command line comes back unchanged.
# Steps: docs/development/tenancy-phase1-runbook.md.
[Service]
# An empty ExecStart= clears the base unit's; the next line replaces it.
ExecStart=
ExecStart=/usr/bin/python3.11 -m server.relay --db /var/lib/ai-passport-tv/tv.db --devices-dir /var/lib/ai-passport-tv/devices --key-file /etc/ai-passport-tv/relay-key --cstone /etc/ai-passport-tv/cstone.json --main-channels /var/lib/ai-passport-tv/channels.txt --public-url https://<site> --ffmpeg /opt/ai-passport-tv/ffmpeg-btbn-8.1
ReadWritePaths=/var/lib/ai-passport-tv
