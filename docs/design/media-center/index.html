<title>小鼠电视 RooTV · 家庭媒体中心（原型）</title>
<style>
/* 设计原型（docs/superpowers/specs/2026-10-24-media-center-ui-design.md 第 10 节「视觉语言」）。
   风格向电视盒子的系统界面靠：大圆角卡片、柔和阴影、焦点时卡片浮起放大带一点视差和反光、毛玻璃材质、顶部标签栏。
   只用系统字体，不加载任何字体或图片；所有封面、台标、标志都是 SVG / CSS 画的占位，数据是假的。
   产品名只在脚本里的 BRAND / BRAND_ZH 两个常量里；应用图标、托盘图标和字标由脚本里的 iconSVG / traySVG / wordmarkSVG 画。 */

/* ---- 颜色：默认深色；.dk 把一块区域固定成深色（大图上的文字），.lg 固定成浅色（品牌页的浅色样张） ---- */
:root, .dk {
  --bg: #0b0b0d; --bg-2: #1a1a1d; --bg-3: #26262b;
  --fill: rgba(255,255,255,.08); --fill-2: rgba(255,255,255,.14); --fill-3: rgba(255,255,255,.24);
  --sep: rgba(255,255,255,.10);
  --label: #f5f5f7; --label-2: rgba(235,235,245,.68); --label-3: rgba(235,235,245,.55); --label-4: rgba(235,235,245,.28);
  --on-label: #0b0b0d;
  --mat: rgba(40,40,46,.52); --mat-thick: rgba(26,26,30,.80); --mat-line: rgba(255,255,255,.12);
  --focus-bg: #f5f5f7; --focus-fg: #0b0b0d;
  --sh-card: 0 8px 22px rgba(0,0,0,.38); --sh-focus: 0 30px 56px rgba(0,0,0,.62);
  color-scheme: dark;
}
:root[data-theme=light], .lg {
  --bg: #f2f2f6; --bg-2: #ffffff; --bg-3: #e4e4ea;
  --fill: rgba(0,0,0,.05); --fill-2: rgba(0,0,0,.08); --fill-3: rgba(0,0,0,.15);
  --sep: rgba(0,0,0,.10);
  --label: #111113; --label-2: rgba(60,60,67,.80); --label-3: rgba(60,60,67,.66); --label-4: rgba(60,60,67,.30);
  --on-label: #ffffff;
  --mat: rgba(255,255,255,.62); --mat-thick: rgba(248,248,251,.84); --mat-line: rgba(0,0,0,.08);
  --focus-bg: #111113; --focus-fg: #ffffff;
  --sh-card: 0 6px 16px rgba(0,0,0,.12); --sh-focus: 0 24px 44px rgba(0,0,0,.26);
  color-scheme: light;
}
:root {
  --page: #0b0b0d;
  --brand: #ff6b3d; --brand-2: #ffb05a; --live: #ff4b3e; --ok: #34c76a; --warn: #ffb340;
  --r-xs: 6px; --r-s: 10px; --r-m: 14px; --r-l: 20px; --r-xl: 28px;
  --ease: cubic-bezier(.2,.8,.2,1); --ease-sheet: cubic-bezier(.32,.72,0,1);
  --t-fast: .14s; --t-focus: .22s; --t-sheet: .38s; --t-fade: .26s;
  --blur: saturate(180%) blur(28px);
  --sans: -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
  --g: 56px; --topH: 76px; --sat: 0px; --sab: 0px;
}
:root[data-theme=light] { --page: #f2f2f6; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--page); color: var(--label); font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: default; opacity: .45; }
a { color: inherit; text-decoration: none; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--label); outline-offset: 3px; border-radius: 8px; }
[hidden] { display: none !important; }
svg { display: block; }
.num { font-variant-numeric: tabular-nums; }

/* ---- 舞台：桌面铺满；「手机」时套一个 390×844 的框 ---- */
#stage { height: 100vh; display: flex; }
#stage.framed { align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, var(--bg-3), var(--page) 72%); }
#app { position: relative; flex: 1; height: 100vh; overflow: hidden; background: var(--page); }
#stage.framed #app { flex: none; width: 410px; height: 864px; border: 10px solid #000; border-radius: 54px; --sat: 44px; --sab: 22px;
                     box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 0 0 1px var(--sep); }
#sbar { display: none; }
#stage.framed #sbar { display: flex; position: absolute; z-index: 30; left: 0; right: 0; top: 0; height: 44px; padding: 14px 34px 0; justify-content: space-between;
                      font: 600 15px var(--sans); pointer-events: none; color: var(--label); }
#stage.framed #sbar i { width: 26px; height: 12px; border-radius: 3px; border: 1.5px solid currentColor; opacity: .8; }
#stage.framed #app.herotop:not(.scrolled) #sbar { color: #fff; }

/* ---- 原型面板（不是产品的一部分） ---- */
#proto { position: fixed; z-index: 50; left: 12px; bottom: 12px; width: 214px; padding: 12px; border: 1px dashed var(--label-4); border-radius: 16px;
         background: var(--mat-thick); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); font-size: 12px; color: var(--label-2); display: grid; gap: 8px; }
#proto b { color: var(--brand); font: 700 12px var(--sans); letter-spacing: .04em; }
#proto .seg { display: flex; padding: 2px; border-radius: 9px; background: var(--fill); }
#proto .seg button { flex: 1; padding: 4px 0; text-align: center; border-radius: 7px; color: var(--label-2); }
#proto .seg button[aria-pressed=true] { background: var(--fill-3); color: var(--label); font-weight: 600; }
#proto select { width: 100%; margin-top: 3px; background: var(--fill); border: 0; border-radius: 8px; padding: 5px; color: var(--label); }
#proto a { color: var(--label); font-weight: 600; }
#proto.framed { left: 24px; top: 24px; bottom: auto; }
#proto.mhide { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---- 主滚动区 ---- */
#main { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: var(--fill-3) transparent; }
#view { padding: calc(var(--topH) + 12px) var(--g) 140px; }
#view.bleed { padding-top: 0; }
.ph { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin: 8px 0 22px; }
.lt { margin: 0; font: 700 40px/1.1 var(--sans); letter-spacing: -.01em; }

/* ---- 顶部标签栏（桌面）/ 导航栏（手机） ---- */
#top { position: absolute; z-index: 8; left: 0; right: 0; top: 0; height: var(--topH); display: flex; align-items: center; gap: 16px; padding: 0 var(--g);
       color: var(--label); transition: background var(--t-fade) var(--ease), box-shadow var(--t-fade) var(--ease); }
#top.solid { background: var(--mat-thick); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 1px 0 var(--mat-line); }
#top.dk:not(.solid) { background: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,0)); }
#top .tl, #top .tr { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 10px; }
#top .tr { justify-content: flex-end; }
.wml { display: inline-flex; padding: 6px 8px; margin-left: -8px; border-radius: 10px; }
.ttabs { flex: none; display: flex; gap: 2px; padding: 5px; border-radius: 999px; background: var(--mat); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: inset 0 0 0 1px var(--mat-line); }
.ttabs a { position: relative; height: 40px; padding: 0 20px; border-radius: 999px; display: flex; align-items: center; gap: 6px; font: 600 15px var(--sans); color: var(--label-2);
           transition: transform var(--t-focus) var(--ease), background var(--t-fast), color var(--t-fast), box-shadow var(--t-focus); }
.ttabs a:hover { color: var(--label); }
.ttabs a[aria-current=page] { background: var(--fill-2); color: var(--label); }
.ttabs a em { position: absolute; top: 4px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--brand); color: #fff; font: 700 10px/16px var(--sans); font-style: normal; text-align: center; }
.ttabs a:focus-visible, .iconbtn:focus-visible, .wml:focus-visible, .tchip:focus-visible { outline: none; background: var(--focus-bg); color: var(--focus-fg); transform: scale(1.06); box-shadow: 0 10px 26px rgba(0,0,0,.35); }
.ntitle { display: none; }
.iconbtn { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; color: var(--label);
           transition: transform var(--t-focus) var(--ease), background var(--t-fast), color var(--t-fast), box-shadow var(--t-focus); }
.iconbtn:hover, .iconbtn[aria-current=page] { background: var(--fill-2); }
.tchip { flex: none; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--mat); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
         box-shadow: inset 0 0 0 1px var(--mat-line); color: var(--label); font: 600 14px var(--sans); white-space: nowrap;
         transition: transform var(--t-focus) var(--ease), background var(--t-fast), color var(--t-fast), box-shadow var(--t-focus); }
.tchip:hover { background: var(--fill-2); }
.tchip small { color: var(--label-3); font: 500 12px var(--sans); }
.tchip:focus-visible small { color: inherit; opacity: .7; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ok); }
.dot.off { background: var(--label-4); }
.me { width: 36px; height: 36px; flex: none; border-radius: 50%; background: linear-gradient(135deg, #8e6cf0, #4b7bea); color: #fff; display: grid; place-items: center; font: 700 15px var(--sans); }
@media (max-width: 1180px) { .d #top .tchip small, .d .ttabs a svg { display: none; } .d .ttabs a { padding: 0 14px; } }

/* ---- 标志：图标和字标都是脚本里的 SVG（iconSVG / wordmarkSVG），这里只管摆放 ---- */
.wml { gap: 10px; align-items: center; color: var(--label); }
.wml > svg:first-child { flex: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.25)); }
.wml:focus-visible { color: var(--focus-fg); }
/* ---- 通用控件 ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 22px; border-radius: 12px; white-space: nowrap;
       background: var(--fill-2); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); color: var(--label); font: 600 16px var(--sans);
       transition: transform var(--t-focus) var(--ease), background var(--t-fast), color var(--t-fast), box-shadow var(--t-focus); }
.btn:hover { background: var(--fill-3); }
.btn.pri { background: var(--label); color: var(--on-label); }
.btn.pri:hover { background: var(--label); opacity: .92; }
.btn small { font: 500 13px var(--sans); opacity: .7; }
.btn.sm { height: 36px; padding: 0 14px; font-size: 14px; border-radius: 10px; }
.btn.ghost { background: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
.btn:focus-visible { outline: none; background: var(--focus-bg); color: var(--focus-fg); transform: scale(1.06); box-shadow: 0 14px 30px rgba(0,0,0,.4); opacity: 1; }
.btn.pri:focus-visible { box-shadow: 0 14px 30px rgba(0,0,0,.4), 0 0 0 3px var(--brand); }
.split { display: inline-flex; gap: 2px; }
.split .btn:first-child { border-radius: 12px 4px 4px 12px; }
.split .btn.caret { border-radius: 4px 12px 12px 4px; padding: 0 12px; }
.chips { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 22px; }
.chips button, .chips a { height: 38px; padding: 0 16px; border-radius: 999px; background: var(--fill); color: var(--label-2); font: 600 14px var(--sans); display: inline-flex; align-items: center; gap: 6px; text-align: center;
                          transition: transform var(--t-focus) var(--ease), background var(--t-fast), color var(--t-fast); }
.chips button:hover, .chips a:hover { background: var(--fill-2); color: var(--label); }
.chips [aria-pressed=true] { background: var(--label); color: var(--on-label); }
.chips em { font: 600 11px var(--sans); font-style: normal; opacity: .6; font-variant-numeric: tabular-nums; }
.chips :focus-visible { outline: none; background: var(--focus-bg); color: var(--focus-fg); transform: scale(1.07); box-shadow: 0 10px 24px rgba(0,0,0,.3); }
.segc { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--fill); }
.segc a { height: 34px; padding: 0 18px; border-radius: 9px; display: flex; align-items: center; font: 600 14px var(--sans); color: var(--label-2); transition: transform var(--t-focus) var(--ease); }
.segc a[aria-current=page] { background: var(--fill-3); color: var(--label); box-shadow: 0 2px 6px rgba(0,0,0,.18); }
.segc a:focus-visible { outline: none; background: var(--focus-bg); color: var(--focus-fg); transform: scale(1.05); }
.hint { color: var(--label-3); font-size: 13px; margin: 12px 0 0; max-width: 900px; }
.h2 { display: flex; align-items: baseline; gap: 12px; margin: 30px 0 0; }
.h2 h2 { margin: 0; font: 700 22px var(--sans); letter-spacing: -.005em; }
.h2 small { color: var(--label-3); font-size: 13px; }
.h2 .more { margin-left: auto; color: var(--label-2); font: 600 14px var(--sans); padding: 4px 10px; border-radius: 8px; }
.h2 .more:hover { color: var(--label); background: var(--fill); }
.banner { display: flex; gap: 16px; align-items: center; margin: 0 0 22px; padding: 16px 20px; border-radius: 18px; background: var(--mat-thick); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: inset 0 0 0 1px var(--mat-line); }
.banner b { display: block; font: 600 16px var(--sans); }
.banner p { margin: 2px 0 0; font-size: 14px; color: var(--label-2); }
.banner .btn { margin-left: auto; }
.banner .ico { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--brand); }
.banner.warn .ico { color: var(--warn); }
.empty { text-align: center; padding: 64px 24px; border-radius: var(--r-l); background: var(--bg-2); color: var(--label-2); }
.empty .eic { width: 88px; height: 88px; margin: 0 auto; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: var(--label-2); }
.empty b { display: block; margin: 18px 0 6px; font: 700 22px var(--sans); color: var(--label); }
.empty p { margin: 0 auto 20px; max-width: 440px; font-size: 15px; }
.tag { display: inline-block; font: 600 12px var(--sans); padding: 4px 9px; border-radius: 7px; background: var(--fill); color: var(--label-2); white-space: nowrap; }
.sw { position: relative; width: 51px; height: 31px; flex: none; border-radius: 16px; background: var(--fill-3); transition: background var(--t-fast); }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); transition: transform var(--t-focus) var(--ease); }
.sw[aria-checked=true] { background: var(--brand); }
.sw[aria-checked=true]::after { transform: translateX(20px); }
.sw:focus-visible { outline: 2px solid var(--label); outline-offset: 3px; border-radius: 16px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--fill-3); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--fill-3); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
input[type=range]:focus-visible { outline: 2px solid var(--label); outline-offset: 2px; border-radius: 8px; }

/* ---- 卡片和货架：焦点 = 浮起 + 放大 + 反光；鼠标在上面时跟着指针轻微倾斜 ---- */
.shelf { display: flex; gap: 24px; overflow-x: auto; overflow-y: hidden; padding: 16px var(--g) 30px; margin: 0 calc(-1 * var(--g)); scroll-padding-inline: var(--g); scroll-snap-type: x proximity; scrollbar-width: none; }
.shelf::-webkit-scrollbar { display: none; }
.shelf > * { flex: none; scroll-snap-align: start; }
.card { display: block; width: 300px; text-align: left; border-radius: var(--r-m); scroll-margin: calc(var(--topH) + 30px) var(--g) 150px; }
.card.p { width: 176px; }
.card .art { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: var(--r-m); overflow: hidden; background: var(--bg-3); box-shadow: var(--sh-card);
             transform: perspective(900px) translateY(var(--lift, 0px)) scale(var(--sc, 1)) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
             transition: transform var(--t-focus) var(--ease), box-shadow var(--t-focus) var(--ease); }
.card.p .art { aspect-ratio: 2 / 3; border-radius: 12px; }
.card .art > svg { width: 100%; height: 100%; }
.card .art::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity var(--t-focus) var(--ease);
                    background: radial-gradient(130% 90% at var(--mx, 50%) var(--my, 0%), rgba(255,255,255,.30), rgba(255,255,255,.06) 42%, rgba(255,255,255,0) 68%);
                    box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); }
.card .art::before { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0;
                     background: linear-gradient(105deg, rgba(255,255,255,0) 35%, rgba(255,255,255,.22) 50%, rgba(255,255,255,0) 65%); transform: translateX(-120%); }
.card:is(:hover, :focus-visible):not(:disabled) .art { --lift: -6px; --sc: 1.07; box-shadow: var(--sh-focus); }
.card:is(:hover, :focus-visible):not(:disabled) .art::after { opacity: 1; }
.card:focus-visible .art::before { animation: sheen .9s var(--ease) .06s both; }
@keyframes sheen { from { opacity: 1; transform: translateX(-120%); } to { opacity: 1; transform: translateX(120%); } }
.card:focus-visible { outline: none; }
.card .t, .card .s, .card .s2, .card .who { transition: transform var(--t-focus) var(--ease); }
.card:is(:hover, :focus-visible):not(:disabled) :is(.t, .s, .s2, .who) { transform: translateY(5px); }
.card .t { display: block; margin-top: 12px; font: 600 15px/1.35 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .s { display: block; margin-top: 1px; font-size: 13px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .s.go { color: var(--brand); font-weight: 600; }
.card .s2 { display: block; font-size: 12px; color: var(--label-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbar { position: absolute; left: 12px; right: 12px; bottom: 10px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.32); overflow: hidden; z-index: 2; }
.pbar i { display: block; height: 100%; border-radius: 2px; background: #fff; }
.badge { position: absolute; z-index: 2; top: 10px; left: 10px; font: 700 11px/1 var(--sans); letter-spacing: .02em; padding: 5px 7px; border-radius: var(--r-xs); background: rgba(0,0,0,.52);
         -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: #fff; display: inline-flex; align-items: center; gap: 3px; }
.badge.r { left: auto; right: 10px; }
.badge.live { background: var(--live); }
.badge.new { background: var(--brand); }
.badge.b { bottom: 10px; top: auto; }
.logo-on { position: absolute; z-index: 2; left: 12px; bottom: 22px; width: 52px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 34px 24px; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 34px 24px; }
.pgrid .card, .wgrid .card { width: auto; }
.onb { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 16px; }
.onb a { display: block; padding: 22px; border-radius: var(--r-l); background: var(--bg-2); box-shadow: var(--sh-card); transition: transform var(--t-focus) var(--ease), box-shadow var(--t-focus); }
.onb a:hover, .onb a:focus-visible { outline: none; transform: translateY(-4px) scale(1.03); box-shadow: var(--sh-focus); }
.onb b { display: flex; align-items: center; gap: 10px; font: 700 17px var(--sans); }
.onb b svg { color: var(--brand); }
.onb p { margin: 8px 0 0; font-size: 14px; color: var(--label-2); }

/* ---- 首页大图：铺满宽度，底部渐隐到页面底色，左边是标题图 ---- */
.hero { position: relative; height: clamp(500px, 74vh, 740px); margin: 0 calc(-1 * var(--g)); overflow: hidden; color: var(--label); }
.hero .bg, .hero .bg svg, .dhero .bg, .dhero .bg svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero .shade, .dhero .shade { position: absolute; inset: 0; background: linear-gradient(0deg, var(--page) 0, rgba(0,0,0,0) 36%), linear-gradient(90deg, rgba(0,0,0,.74) 0, rgba(0,0,0,.38) 36%, rgba(0,0,0,0) 64%); }
.hero .copy { position: absolute; left: var(--g); bottom: 168px; max-width: 580px; }
.kicker { font: 700 13px var(--sans); letter-spacing: .08em; color: var(--label-2); display: flex; align-items: center; gap: 8px; }
.kicker .badge { position: static; }
.tart { margin: 12px 0 14px; font: 800 66px/1.02 var(--sans); letter-spacing: -.01em; color: #fff; max-width: 11em;
        background: linear-gradient(180deg, #fff 40%, hsl(var(--h, 30) 90% 84%)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 6px 26px rgba(0,0,0,.35)); }
.tart.sm { font-size: 52px; }
.meta { font-size: 14px; color: var(--label-2); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.meta .tag { background: var(--fill-2); color: var(--label); padding: 2px 7px; font-size: 11px; }
.syn { margin: 12px 0 0; font: 15px/1.6 var(--sans); color: var(--label-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; align-items: center; }
.hnav { position: absolute; right: var(--g); bottom: 172px; display: flex; gap: 10px; align-items: center; }
.hnav .dotb { width: 8px; height: 8px; border-radius: 4px; background: var(--fill-3); transition: width var(--t-focus) var(--ease), background var(--t-fast); }
.hnav .dotb[aria-current=true] { background: var(--label); width: 26px; }
.hnav .iconbtn { background: var(--mat); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
.after { position: relative; z-index: 1; margin-top: -132px; }
.after > section:first-child .h2, .after > .banner:first-child { margin-top: 0; }
.qchips { display: none; }

/* ---- 直播：选中的节目 + 节目指南网格 ---- */
.lhead { display: grid; grid-template-columns: 440px minmax(0, 1fr); gap: 36px; align-items: center; margin: 0 0 24px; }
.lprev { position: relative; aspect-ratio: 16 / 9; border-radius: var(--r-l); overflow: hidden; background: var(--bg-3); box-shadow: var(--sh-card); }
.lprev > svg { width: 100%; height: 100%; }
.lprev .logo-on { width: 64px; left: 14px; top: 14px; bottom: auto; }
.linfo .ch { display: flex; align-items: center; gap: 10px; color: var(--label-2); font-size: 14px; }
.linfo .ch b { font: 700 14px var(--sans); font-variant-numeric: tabular-nums; color: var(--label); }
.linfo h2 { margin: 6px 0 4px; font: 700 32px/1.2 var(--sans); }
.lprog { display: flex; align-items: center; gap: 10px; margin: 12px 0 6px; font: 500 12px var(--sans); font-variant-numeric: tabular-nums; color: var(--label-3); max-width: 480px; }
.lprog .trk { flex: 1; height: 5px; border-radius: 3px; background: var(--fill-2); overflow: hidden; }
.lprog .trk i { display: block; height: 100%; border-radius: 3px; background: var(--label); }
.lnext { font-size: 14px; color: var(--label-2); }
.lnext b { color: var(--label); font-weight: 600; }
.guide { border-radius: var(--r-l); background: var(--bg-2); overflow: hidden; box-shadow: inset 0 0 0 1px var(--sep); }
.gscroll { overflow: auto; max-height: 600px; position: relative; scrollbar-width: thin; scrollbar-color: var(--fill-3) transparent; }
.ginner { position: relative; }
.grow { display: flex; height: 68px; }
.gch { position: sticky; left: 0; z-index: 3; flex: none; width: var(--chw); display: flex; align-items: center; gap: 12px; padding: 0 14px;
       background: var(--bg-2); box-shadow: 1px 0 0 var(--sep); }
.gch .no { font: 600 13px var(--sans); font-variant-numeric: tabular-nums; color: var(--label-3); width: 20px; }
.gch .lg { width: 46px; flex: none; }
.gch span { font: 600 14px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gch.cur { box-shadow: 1px 0 0 var(--sep), inset 4px 0 0 var(--brand); }
.gprogs { position: relative; flex: none; }
.gp { position: absolute; top: 5px; bottom: 5px; padding: 8px 12px; border-radius: var(--r-s); background: var(--fill); overflow: hidden; text-align: left;
      scroll-margin: 48px 24px 24px calc(var(--chw) + 16px); transition: transform var(--t-focus) var(--ease), background var(--t-fast), box-shadow var(--t-focus); }
.gp b { display: block; font: 600 14px/1.3 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gp small { display: block; white-space: nowrap; overflow: hidden; font: 500 12px var(--sans); font-variant-numeric: tabular-nums; color: var(--label-3); }
.gp:hover { background: var(--fill-2); }
.gp.now { background: var(--fill-2); }
.gp.now small { color: var(--label-2); }
.gp.past { opacity: .5; }
.gp .gpb { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--brand); }
.gp[aria-pressed=true] { box-shadow: inset 0 0 0 2px var(--label); }
.gp:focus-visible { outline: none; z-index: 2; background: var(--focus-bg); transform: scale(1.04); box-shadow: 0 12px 26px rgba(0,0,0,.4); opacity: 1; }
.gp:focus-visible b, .gp:focus-visible small { color: var(--focus-fg); }
.gruler { position: sticky; top: 0; z-index: 4; display: flex; height: 38px; background: var(--bg-2); box-shadow: 0 1px 0 var(--sep); }
.gcorner { position: sticky; left: 0; z-index: 5; flex: none; width: var(--chw); padding: 10px 14px; font: 600 12px var(--sans); color: var(--label-2); background: var(--bg-2); box-shadow: 1px 0 0 var(--sep); }
.gticks { position: relative; flex: none; }
.gticks span { position: absolute; top: 11px; font: 500 12px var(--sans); font-variant-numeric: tabular-nums; color: var(--label-3); padding-left: 6px; }
.gnow { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--brand); z-index: 2; pointer-events: none; }
.gnow span { position: sticky; top: 8px; display: block; width: 48px; margin-left: -23px; padding: 3px 0; text-align: center; border-radius: 6px; background: var(--brand); color: #fff; font: 700 11px var(--sans); font-variant-numeric: tabular-nums; z-index: 6; }

/* ---- 小电视的频道表（直播的第二个分段） ---- */
.lineup { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-items: start; }
.lgrp { border-radius: 18px; margin-bottom: 18px; overflow: hidden; background: var(--bg-2); }
.lgrp > header { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px 8px; font: 700 16px var(--sans); }
.lgrp > header small { font: 500 12px var(--sans); color: var(--label-3); }
.lrow { display: grid; grid-template-columns: 20px 30px 52px minmax(0, 1fr) auto 52px; gap: 12px; align-items: center; padding: 10px 16px; box-shadow: inset 0 1px 0 var(--sep); }
.lrow .grip { color: var(--label-4); cursor: grab; letter-spacing: -2px; }
.lrow .no { font: 600 13px var(--sans); font-variant-numeric: tabular-nums; color: var(--label-3); }
.lrow .nm { font: 600 15px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .nm small { display: block; font: 400 12px var(--sans); color: var(--label-2); }
.lrow svg { border-radius: 8px; }
.panel { border-radius: 18px; padding: 18px; background: var(--bg-2); margin-bottom: 18px; }
.panel h3 { margin: 0 0 6px; font: 700 17px var(--sans); }
.meter { height: 8px; border-radius: 4px; background: var(--fill-2); overflow: hidden; margin: 12px 0 6px; }
.meter i { display: block; height: 100%; border-radius: 4px; background: var(--brand); }
.src { display: flex; align-items: center; gap: 12px; padding: 12px 0; box-shadow: inset 0 1px 0 var(--sep); font: 500 14px var(--sans); }
.src:first-of-type { box-shadow: none; }
.src > svg { color: var(--label-2); }
.src span { flex: 1; min-width: 0; }
.src small { display: block; color: var(--label-3); font-size: 12px; font-weight: 400; }

/* ---- 详情：铺满的背景图 + 标题图，下面是选集货架 ---- */
.dhero { position: relative; margin: 0 calc(-1 * var(--g)); min-height: clamp(520px, 76vh, 740px); display: flex; align-items: flex-end; padding: 0 var(--g) 40px; overflow: hidden; }
.dhero .shade { background: linear-gradient(0deg, var(--page) 0, rgba(0,0,0,0) 42%), linear-gradient(90deg, rgba(0,0,0,.80) 0, rgba(0,0,0,.45) 40%, rgba(0,0,0,0) 70%); }
/* 浅色：大图上的字永远是白的，所以大图不往白色页面里渐隐、货架也不压在图上，图的下沿加深 */
:root[data-theme=light] :is(.hero, .dhero) .shade { background: linear-gradient(0deg, rgba(0,0,0,.55) 0, rgba(0,0,0,0) 45%), linear-gradient(90deg, rgba(0,0,0,.78) 0, rgba(0,0,0,.4) 38%, rgba(0,0,0,0) 66%); }
:root[data-theme=light] .hero { height: clamp(460px, 66vh, 660px); }
:root[data-theme=light] .hero .copy { bottom: 76px; }
:root[data-theme=light] .hnav { bottom: 80px; }
:root[data-theme=light] .after { margin-top: 8px; }
.dcopy { position: relative; max-width: 660px; color: var(--label); }
.dcopy .syn { -webkit-line-clamp: 3; }
.lastw { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 14px; color: var(--label-2); }
.lastw .trk { width: 120px; height: 4px; border-radius: 2px; background: var(--fill-3); overflow: hidden; }
.lastw .trk i { display: block; height: 100%; background: var(--label); }
.facts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.card.ep { width: 320px; }

/* ---- UP 主 ---- */
.ups { display: flex; gap: 26px; overflow-x: auto; padding: 14px var(--g) 22px; margin: -6px calc(-1 * var(--g)) 4px; scrollbar-width: none; }
.up { flex: none; width: 104px; text-align: center; border-radius: 12px; scroll-margin: 0 var(--g); }
.up .av { position: relative; display: block; width: 96px; height: 96px; margin: 0 auto; border-radius: 50%; box-shadow: var(--sh-card); transition: transform var(--t-focus) var(--ease), box-shadow var(--t-focus); }
.up .av svg { border-radius: 50%; }
.up .av.pl { display: grid; place-items: center; background: var(--fill-2); color: var(--label-2); }
.up .av.add { display: grid; place-items: center; background: none; box-shadow: inset 0 0 0 2px var(--fill-3); color: var(--label-2); }
.up:is(:hover, :focus-visible) .av { transform: scale(1.1); box-shadow: var(--sh-focus); }
.up:focus-visible { outline: none; }
.up[aria-pressed=true] .av { box-shadow: 0 0 0 3px var(--page), 0 0 0 6px var(--label); }
.up .av em { position: absolute; right: 0; top: 0; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--brand); color: #fff; font: 700 12px/22px var(--sans); font-style: normal; }
.up span { display: block; margin-top: 12px; font: 600 14px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.up small { font-size: 12px; color: var(--label-3); }
.who { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.who svg { flex: none; border-radius: 50%; }
.who .s { margin: 0; }

/* ---- 片库 ---- */
.srcbar { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 18px; }
.srcbar .pill { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 12px; background: var(--bg-2); font: 600 13px var(--sans); }
.srcbar .pill small { color: var(--label-3); font-weight: 400; }
.srcbar .pill.add { background: none; box-shadow: inset 0 0 0 1.5px var(--fill-3); color: var(--label-2); }

/* ---- 搜索 ---- */
.bigsearch { display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 20px; border-radius: 16px; background: var(--fill); margin: 0 0 16px; color: var(--label-3); max-width: 900px; transition: background var(--t-fast), box-shadow var(--t-fast); }
.bigsearch:focus-within { background: var(--fill-2); box-shadow: 0 0 0 2px var(--label); }
.bigsearch input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--label); font: 500 22px var(--sans); }
.bigsearch input:focus-visible { outline: none; }
.rlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 8px 20px; margin-top: 12px; }
.ritem { display: grid; grid-template-columns: 128px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 10px; border-radius: 16px; text-align: left; width: 100%;
         transition: transform var(--t-focus) var(--ease), background var(--t-fast), box-shadow var(--t-focus); }
.ritem:hover { background: var(--fill); }
.ritem:focus-visible { outline: none; background: var(--bg-2); transform: scale(1.03); box-shadow: var(--sh-focus); }
.ritem .art { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: var(--bg-3); }
.ritem .art svg { width: 100%; height: 100%; }
.ritem .art.av { background: none; display: grid; place-items: center; }
.ritem .art.av svg { width: 52px; height: 52px; }
.ritem b { display: block; font: 600 15px var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ritem > span > span { font-size: 13px; color: var(--label-2); }
.ritem mark { background: none; color: var(--brand); }

/* ---- 设备 ---- */
.devs { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
.dev { border-radius: 22px; padding: 18px; background: var(--bg-2); display: grid; gap: 14px; align-content: start; }
.dev.off { opacity: .7; }
.dev header { display: flex; align-items: center; gap: 10px; }
.dev header b { font: 700 17px var(--sans); }
.dev header small { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--label-2); }
.dev .model { font-size: 13px; color: var(--label-3); }
.tvbox { display: flex; justify-content: center; align-items: center; padding: 16px; border-radius: 16px; background: var(--fill); min-height: 150px; color: var(--label-2); font-size: 14px; }
/* 小电视自己的屏幕（固件画面）：沿用它真实的琥珀色等宽数字，不跟着界面主题变 */
.tvface { --amber: #ffb547; --amber-soft: #f3dfb4; --tvred: #e0654d; }
.tvscr { width: 214px; border: 7px solid #1d1d20; border-radius: 12px; background: #000; padding: 10px 12px; font-family: Menlo, "SF Mono", ui-monospace, monospace; box-shadow: 0 10px 24px rgba(0,0,0,.3); }
.tvscr .n { font: 600 28px/1 Menlo, ui-monospace, monospace; color: var(--amber); text-shadow: 0 0 8px rgba(255,181,71,.35); }
.tvscr .g { float: right; font-size: 10px; color: var(--tvred); }
.tvscr .x { margin-top: 8px; font: 13px/1.35 var(--sans); color: var(--amber-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tvscr .y { font: 11px/1.4 var(--sans); color: #8c8170; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tvscr.dark .n, .tvscr.dark .x { color: #2a2a2e; text-shadow: none; }
.dev .row { display: flex; gap: 8px; flex-wrap: wrap; }
.dev.add { place-content: center; justify-items: center; text-align: center; background: none; box-shadow: inset 0 0 0 2px var(--fill-2); color: var(--label-2); min-height: 280px; }
.dev.add b { font: 700 17px var(--sans); color: var(--label); }
.dev.add p { margin: 0; font-size: 13px; }

/* ---- 列表（设置 / 我的）：圆角分组 ---- */
.list { border-radius: 16px; overflow: hidden; margin-bottom: 22px; background: var(--bg-2); max-width: 780px; }
.list > h3 { margin: 0; padding: 14px 18px 6px; font: 600 13px var(--sans); color: var(--label-3); letter-spacing: .02em; }
.li { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 58px; padding: 10px 18px; text-align: left; box-shadow: inset 0 1px 0 var(--sep); transition: background var(--t-fast); }
.list > h3 + .li, .list > .li:first-child { box-shadow: none; }
.li > span { flex: 1; min-width: 0; font: 500 15px var(--sans); }
.li > span small { display: block; font: 400 13px var(--sans); color: var(--label-2); }
.li > em { font-style: normal; font-size: 14px; color: var(--label-3); }
.li .ico { width: 30px; height: 30px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--fill-2); color: var(--label); }
a.li:hover, button.li:hover { background: var(--fill); }
a.li:focus-visible, button.li:focus-visible { outline: none; background: var(--fill-2); box-shadow: inset 0 0 0 2px var(--label); border-radius: 16px; }

/* ---- 品牌页 ---- */
.bvar { border-radius: 24px; background: var(--bg-2); padding: 22px; margin-bottom: 22px; }
.bvar header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.bvar h2 { margin: 0; font: 700 20px var(--sans); }
.bvar header .btn { margin-left: auto; }
.bvar header .btn[aria-pressed=true] { background: var(--label); color: var(--on-label); }
.bvar > p { margin: 6px 0 16px; color: var(--label-2); font-size: 14px; max-width: 780px; }
.isz { display: flex; align-items: flex-end; gap: 26px; flex-wrap: wrap; padding: 22px; border-radius: 18px; background: var(--bg); }
.isz figure, .trow figure { margin: 0; display: grid; justify-items: center; gap: 8px; }
figcaption { font: 500 12px var(--sans); color: var(--label-3); white-space: nowrap; }
.trow { align-items: start; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 14px; }
.mbar { display: flex; align-items: center; justify-content: flex-end; gap: 14px; width: 100%; height: 30px; padding: 0 14px; border-radius: 8px; font: 500 13px var(--sans); }
.mbar.l { background: #e6e6eb; color: #000; } .mbar.d { background: #26262b; color: #fff; }
.mbar i { width: 16px; height: 10px; border-radius: 2px; background: currentColor; opacity: .35; }
.tzoom { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 10px; }
.tzoom.l { background: #e6e6eb; color: #000; } .tzoom.d { background: #26262b; color: #fff; }
.lock { display: flex; align-items: center; gap: 14px; padding: 22px; border-radius: 18px; background: var(--bg-2); box-shadow: inset 0 0 0 1px var(--sep); color: var(--label); }
.lock.dk { background: #0b0b0d; }
.lock .zh { font: 700 19px var(--sans); letter-spacing: .12em; color: var(--label-2); }
.lock.st { flex-direction: column; gap: 10px; }
.locks { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-top: 14px; }
.code { font: 13px Menlo, ui-monospace, monospace; background: var(--fill); padding: 2px 6px; border-radius: 6px; }
.todo { margin: 0; padding-left: 20px; color: var(--label-2); font-size: 14px; line-height: 1.8; max-width: 820px; }
.todo b { color: var(--label); font-weight: 600; }

/* ---- 正在播放栏：浮在底部的毛玻璃胶囊 ---- */
#mini { position: absolute; z-index: 7; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(960px, calc(100% - 2 * var(--g))); height: 72px;
        display: flex; align-items: center; gap: 14px; padding: 0 12px 0 10px; border-radius: 22px; overflow: hidden;
        background: var(--mat-thick); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 18px 50px rgba(0,0,0,.4), inset 0 0 0 1px var(--mat-line); }
.mprog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--fill); }
.mprog i { display: block; height: 100%; background: var(--label); }
.mart { position: relative; width: 92px; aspect-ratio: 16 / 9; flex: none; border-radius: 9px; overflow: hidden; background: var(--bg-3); transition: transform var(--t-focus) var(--ease); }
.mart svg { width: 100%; height: 100%; }
.mart .badge { top: 4px; left: 4px; font-size: 9px; padding: 3px 4px; }
button.mart:focus-visible { outline: 2px solid var(--label); outline-offset: 2px; transform: scale(1.06); }
.mtx { min-width: 0; flex: 1; }
.mtx b { display: block; font: 600 15px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mtx span { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--label-2); white-space: nowrap; overflow: hidden; }
.mctl { display: flex; align-items: center; gap: 4px; }
.mctl .iconbtn.big { width: 48px; height: 48px; background: var(--label); color: var(--on-label); }
#mini.idle { padding-left: 22px; }
#mini.idle .mtx b { color: var(--label-2); }

/* ---- 手机底栏 ---- */
#tabs { display: none; }

/* ---- 抽屉 / 底部面板（播放到 / 遥控 / 添加）：厚毛玻璃 ---- */
#scrim { position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,.42); animation: fade var(--t-fade) var(--ease); }
#sheet { position: absolute; z-index: 21; top: 12px; right: 12px; bottom: 12px; width: 440px; max-width: calc(100% - 24px); display: flex; flex-direction: column; border-radius: 26px; overflow: hidden;
         background: var(--mat-thick); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 0 0 1px var(--mat-line);
         animation: inR var(--t-sheet) var(--ease-sheet); }
@keyframes fade { from { opacity: 0; } }
@keyframes inR { from { transform: translateX(40px); opacity: 0; } }
@keyframes inU { from { transform: translateY(100%); } }
.shh { display: flex; align-items: center; gap: 10px; padding: 20px 20px 12px; }
.shh h2 { margin: 0; font: 700 22px var(--sans); }

<script>
"use strict";
/* 产品名（已定）：界面上的字标写 RooTV；中文界面需要产品名的地方（窗口标题、关于、空状态）写「小鼠电视」。 */

/* ============================== 小工具 ============================== */

const NOW = 20 * 60 + 12; // 原型的时钟固定在 20:12，截图每次一样
const G0 = 19 * 60, G1 = 23 * 60 + 30;
const RM = matchMedia("(prefers-reduced-motion: reduce)");
const SANS = "-apple-system,PingFang SC,Helvetica Neue,sans-serif";

const IC = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',

  prev: '<path d="M20 5.5v13a1 1 0 0 1-1.6.8l-9-6.5a1 1 0 0 1 0-1.6l9-6.5A1 1 0 0 1 20 5.5zM4.5 5H7v14H4.5z" fill="currentColor" stroke="none"/>',
  tv: '<rect x="2" y="5" width="20" height="13" rx="3"/><path d="M8 21h8"/>',

  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>',
  moon: '<path d="M20 15A8 8 0 1 1 9 4a7 7 0 0 0 11 11z"/>',

/* ============================== 标志 ============================== */

const ICON_VARIANTS = {
  a: { name: "电视里的小鼠", bg: ["#ff9b6a", "#ff5c43"] },
  b: { name: "鼠耳小电视", bg: ["#4a5aa0", "#1b2145"] },
  c: { name: "趴在电视上的小鼠", bg: ["#ffdc7c", "#ffad42"] },
};
const MC = { body: "#dcd6e6", shade: "#c3bcd2", ear: "#ffb3c4", nose: "#ff6f86", eye: "#24212d", cream: "#fff4e8", navy: "#262b45" };
// 苹果式的圆角方：超椭圆 |x|^5 + |y|^5 = 1，比普通圆角矩形的转角更顺。
const SQUIRCLE = (() => { const n = 5, pts = []; for (let i = 0; i < 72; i++) { const t = i / 72 * 2 * Math.PI, c = Math.cos(t), s = Math.sin(t);
  pts.push([512 + 512 * Math.sign(c) * Math.abs(c) ** (2 / n), 512 + 512 * Math.sign(s) * Math.abs(s) ** (2 / n)]); }

const pbar = p => p ? `<span class="pbar"><i style="width:${(p * 100).toFixed(1)}%"></i></span>` : "";
function cardItem(id, sub, extra = "") {
  const it = IT[id];
  return `<button class="card" data-play="${id}" aria-label="播放 ${esc(it.title)}"><span class="art">${itemArt(it, "w", { title: !!it.sr ? it.title.replace(/ 第 \d+ 集$/, "") : false })}${extra}${pbar(it.pct)}</span>
    <span class="t">${esc(it.sr ? srById(it.sr).t : it.title)}</span><span class="s">${sub}</span></button>`;
}
function cardLive(c) {
  const p = c.pr[nowI(c)], nx = c.pr[nowI(c) + 1], it = IT["ch:" + c.id];
  return `<button class="card" data-play="ch:${c.id}" aria-label="播放 ${esc(c.name)}，正在播 ${esc(p.n)}"><span class="art">${art(p.n, c.h, "w", { title: false })}<span class="badge live">直播</span><span class="logo-on">${logo(c, 52)}</span>${pbar(it.pct)}</span>
    <span class="t">${esc(p.n)}</span><span class="s">${esc(c.name)} · ${hm(p.s)}–${hm(p.e)}</span>${nx ? `<span class="s2">接下来 ${hm(nx.s)} ${esc(nx.n)}</span>` : ""}</button>`;
}
function cardSeries(s) {
  const badge = s.wait ? `<span class="badge">等更新</span>` : s.done ? `<span class="badge">看完了</span>` : s.upd > s.at && s.at > 0 ? `<span class="badge new">更新 ${s.upd - s.at} 集</span>` : s.isNew && !s.at ? `<span class="badge new">新加</span>` : "";
  const sub = s.at ? (s.done ? `看完了 · 共 ${s.n} 集` : `看到第 ${s.at} 集 · 更新到 ${s.upd}`) : `${s.k} · ${s.upd < s.n ? `更新到第 ${s.upd} 集` : `${s.n} 集全`}`;
  return `<a class="card p" href="#/detail/${s.id}"><span class="art">${art(s.t, s.hue, "p", { kick: s.k })}${badge}${s.at && !s.done ? pbar(s.at / s.n) : ""}</span><span class="t">${esc(s.t)}</span><span class="s">${sub}</span></a>`;
}
function cardLib(x) {
  if (x.k === "家庭视频") return `<button class="card" data-play="lib:${x.id}"><span class="art">${art(x.t, x.hue, "w", { title: false, motif: 3 })}<span class="badge">${x.y}</span></span><span class="t">${esc(x.t)}</span><span class="s">${esc(x.d)}</span></button>`;
  return `<a class="card p" href="#/detail/${x.id}"><span class="art">${art(x.t, x.hue, "p")}${x.id === "wdlx" ? pbar(.62) : ""}${x.id === "xqtk" ? '<span class="badge new">新加</span>' : ""}</span><span class="t">${esc(x.t)}</span><span class="s">${x.y} · ${esc(x.g)}</span></a>`;
}
function cardVid(u, i) {
  const v = u.v[i], id = `v:${u.id}:${i}`, it = IT[id];
  return `<button class="card" data-play="${id}" aria-label="播放 ${esc(v[0])}"><span class="art">${itemArt(it)}<span class="badge r b num">${v[1]}</span>${i < u.nw ? '<span class="badge new">新</span>' : ""}${pbar(it.pct)}</span>
    <span class="t">${esc(v[0])}</span><span class="who">${avatar(u.n, u.hue, 20)}<span class="s">${esc(u.n)} · ${v[2]}</span></span></button>`;
}
const shelf = (title, sub, inner, more, moreT = "全部") => `<section aria-label="${esc(title)}"><div class="h2"><h2>${title}</h2>${sub ? `<small>${sub}</small>` : ""}${more ? `<a class="more" href="${more}">${moreT} ›</a>` : ""}</div><div class="shelf">${inner}</div></section>`;
const banner = (kind, t, p, btn, href) => `<div class="banner ${kind}" role="note"><span class="ico">${ic(kind === "warn" ? "warn" : "info", 22)}</span><div><b>${t}</b><p>${p}</p></div>${btn ? `<a class="btn sm" href="${href}">${btn}</a>` : ""}</div>`;
const emptyBox = (icon, t, p, act = "") => `<div class="empty"><div class="eic">${ic(icon, 40)}</div><b>${t}</b><p>${p}</p>${act}</div>`;
function splitPlay(id, label, small) {
  const d = dev(S.target) || dev("pc");
  return `<span class="split"><button class="btn pri" data-play="${id}">${ic("play", 17)}${label}${small ? ` <small>${small}</small>` : ""}</button><button class="btn pri caret" data-sheet="target" data-item="${id}" aria-label="选择播放到哪里（现在是 ${esc(d.n)}）">${ic("down", 17)}</button></span>`;
}
const toWhere = () => { const d = dev(S.target) || dev("pc"); return d.pc ? "在电脑上" : `到${d.s}`; };
const meta = a => `<div class="meta">${a.filter(Boolean).join('<span aria-hidden="true">·</span>')}</div>`;

/* ============================== 首页 ============================== */
const HERO = [
  { kick: "剧集追更 · 新的一集", id: "xhlc", play: "ep:xhlc:8", btn: "继续第 8 集", small: "12:40", t: "星河列车", hue: 248, meta: ["2026", "番剧", "B站", "更新到第 12 集", '<span class="tag">4K</span>'], syn: SR[0].syn, sr: 1 },
  { kick: "直播 · 正在播", live: "cctv5", play: "ch:cctv5", btn: "看直播", t: "中超联赛第 28 轮", hue: 120, meta: ["CCTV-5 体育", "19:30–21:25", "还有 73 分钟"], syn: "第 28 轮焦点战，上半场刚刚结束。接下来 21:25 是《足球之夜》。" },
  { kick: "片库 · 新添加", id: "xqtk", play: "lib:xqtk", btn: "播放", t: "星期天的客人", hue: 82, meta: ["2020", "剧情", "1 小时 50 分", '<span class="tag">1080p</span>'], syn: "一个下雨的星期天，三位不请自来的客人敲开了老钟表匠的门。", lib: 1 },
];
VIEWS.home = () => {
  const HS = empty() ? [HERO[1]] : HERO; if (S.hero >= HS.length) S.hero = 0;
  const h = HS[S.hero], bg = h.live ? art(h.t, h.hue, "w", { title: false, motif: 2, flip: 1 }) : art(h.t, h.hue, "w", { title: false, motif: h.sr ? 1 : 0, flip: 1 });
  let o = `<section class="hero dk" aria-roledescription="轮播" aria-label="推荐"><div class="bg">${bg}</div><div class="shade"></div>
    <div class="copy"><div class="kicker">${h.live ? '<span class="badge live">直播</span>' : ""}${h.kick}</div><div class="tart${[...h.t].length > 6 ? " sm" : ""}" style="--h:${h.hue}" role="heading" aria-level="2">${esc(h.t)}</div>${meta(h.meta)}<p class="syn">${esc(h.syn)}</p>
    <div class="actions">${splitPlay(h.play, h.btn, h.small)}${h.id ? `<a class="btn" href="#/detail/${h.id}">详情</a>` : `<a class="btn" href="#/live">节目指南</a>`}</div></div>
    <div class="hnav"><button class="iconbtn" data-hero="-1" aria-label="上一个">${ic("back", 18)}</button>${HS.map((_, i) => `<button class="dotb" data-hero-i="${i}" aria-label="第 ${i + 1} 个" ${i === S.hero ? 'aria-current="true"' : ""}></button>`).join("")}<button class="iconbtn" data-hero="1" aria-label="下一个">${ic("fwd", 18)}</button></div></section><div class="after">`;
  if (blocked()) o += banner("warn", "连不上 B 站", "UP 主和剧集暂时不更新，没缓存的封面先用占位图。直播、YouTube 和片库照常。", "查看原因", "#/settings");
  if (S.demo === "notv") o += banner("info", `没有小电视也能用${BRAND_ZH}`, "点任何节目都会在这台电脑上播放。以后买了小电视，输入屏幕上的绑定码就能「播放到」它。", "绑定小电视", "#/devices");
  o += `<div class="chips qchips" aria-label="分类"><a href="#/series">${ic("series", 16)}剧集与番剧</a><a href="#/up">${ic("up", 16)}UP 主</a><a href="#/lib">${ic("lib", 16)}片库</a><a href="#/lineup">${ic("guide", 16)}频道表</a></div>`;
  if (!empty()) o += shelf("继续观看", "在哪台上看的都算", [
    cardItem("ep:xhlc:8", "第 8 集 · 还剩 11 分钟 · 客厅"), cardItem("lib:wdlx", "片库 · 还剩 46 分钟 · 这台电脑"), cardItem("v:xmcf:0", "小满的厨房 · 还剩 6 分钟 · 卧室"),
    cardItem("ep:shxz:21", "第 21 集 · 还剩 38 分钟"), cardItem("v:linlx:0", "Lin 的旅行手账 · YouTube"),
  ].join(""));
  o += shelf("直播 · 正在播", `${hm(NOW)} · 节目信息来自 EPG`, ["cctv5", "cctv1", "hunan", "cctv6", "zhejiang", "phoenix", "cctv14"].map(id => cardLive(chById(id))).join(""), "#/live", "节目指南");
  if (empty()) {
    o += `<div class="h2"><h2>开始收集你爱看的</h2></div><div class="onb">
      <a href="#/up"><b>${ic("up")}订阅一个 UP 主</b><p>B 站或 YouTube 的 UP 主，每个都变成一个台，新视频自动排上。</p></a>
      <a href="#/series"><b>${ic("series")}加一部剧</b><p>番剧、多集视频、合集、播放列表都行，按顺序播，接着上次的地方。</p></a>
      <a href="#/lib"><b>${ic("lib")}添加片库文件夹</b><p>电脑或 NAS 上的电影、剧集、动画和家庭视频，自动配上海报。</p></a></div>`;
  } else {
    o += shelf("UP 主更新", `${UP.reduce((a, u) => a + u.nw, 0)} 个新视频`, UP.filter(u => u.nw).flatMap(u => [...Array(u.nw).keys()].map(i => cardVid(u, i))).join(""), "#/up");
    o += shelf("剧集追更", "", SR.filter(s => !s.done).map(cardSeries).join(""), "#/series");
    o += shelf("我的片库", "最近添加", [...LIB["电影"], ...LIB["动画"]].map(([id]) => cardLib(libById(id))).join(""), "#/lib");
  }
  return o + "</div>";
};

/* ============================== 直播：节目指南网格 ============================== */
const GROUPS = ["全部", "央视", "卫视", "港澳台", "国际", "音乐"];
function liveHead() {
  const sel = S.sel || { ch: "cctv5", i: nowI(chById("cctv5")) }, c = chById(sel.ch), p = c.pr[sel.i], nx = c.pr[sel.i + 1];
  const st = p.e <= NOW ? "past" : p.s > NOW ? "future" : "now", pct = st === "now" ? (NOW - p.s) / (p.e - p.s) : 0;
  const act = st === "now" ? `${splitPlay("ch:" + c.id, "看直播", toWhere())}<button class="btn" data-play="ch:${c.id}" data-to="pc">${ic("pc", 18)}在电脑上看</button>`
    : st === "future" ? `<button class="btn" disabled>${ic("hist", 18)}${hm(p.s)} 开始 · 提醒我（以后）</button><button class="btn" data-play="ch:${c.id}">${ic("play", 16)}看这个台现在播的</button>`
      : `<button class="btn" disabled>已经播完 · 暂不支持回看</button><button class="btn" data-play="ch:${c.id}">${ic("play", 16)}看这个台现在播的</button>`;
  return `<div class="lprev">${art(p.n, c.h, "w", { title: false, motif: 2 })}<span class="logo-on">${logo(c, 64)}</span>${st === "now" ? '<span class="badge live r">直播</span>' : ""}</div>
    <div class="linfo"><div class="ch"><b>${String(c.no).padStart(2, "0")}</b>${esc(c.name)} · ${c.g}</div><h2>${esc(p.n)}</h2>
    <div class="lprog"><span>${hm(p.s)}</span><span class="trk"><i style="width:${pct * 100}%"></i></span><span>${hm(p.e)}</span></div>
    <div class="lnext">${st === "now" ? `还有 ${p.e - NOW} 分钟 · ` : ""}${nx ? `接下来 ${hm(nx.s)} <b>${esc(nx.n)}</b>` : ""}</div><div class="actions">${act}</div></div>`;
}
VIEWS.live = () => {
  const ppm = isM() ? 3.2 : 5, chw = isM() ? 64 : 210, W = (G1 - G0) * ppm;
  const chs = CH.filter(c => S.liveGroup === "全部" || c.g === S.liveGroup), sel = S.sel || { ch: "cctv5", i: nowI(chById("cctv5")) };
  const playingCh = (IT[dev(S.mini)?.now] || {}).ch;
  let ticks = ""; for (let t = G0; t < G1; t += 30) ticks += `<span style="left:${(t - G0) * ppm}px">${hm(t)}</span>`;
  const rows = chs.map(c => `<div class="grow"><div class="gch ${c.id === playingCh ? "cur" : ""}" title="${esc(c.name)}"><span class="no">${String(c.no).padStart(2, "0")}</span><span class="lg">${logo(c, 46)}</span><span>${esc(c.name)}</span></div>
    <div class="gprogs" style="width:${W}px">${c.pr.filter(p => p.e > G0 && p.s < G1).map(p => { const i = c.pr.indexOf(p), s = Math.max(p.s, G0), e = Math.min(p.e, G1), st = p.e <= NOW ? "past" : p.s > NOW ? "" : "now";
      return `<button class="gp ${st}" style="left:${(s - G0) * ppm + 2}px;width:${(e - s) * ppm - 4}px" data-sel="${c.id}:${i}" aria-pressed="${sel.ch === c.id && sel.i === i}" aria-label="${esc(c.name)} ${hm(p.s)} 到 ${hm(p.e)} ${esc(p.n)}${st === "now" ? "，正在播" : ""}"><b>${esc(p.n)}</b><small>${hm(p.s)}–${hm(p.e)}</small>${st === "now" ? `<span class="gpb" style="width:${(NOW - p.s) / (p.e - p.s) * 100}%"></span>` : ""}</button>`; }).join("")}</div></div>`).join("");
  return `<div class="lhead" id="lhead">${liveHead()}</div>
    <div class="chips" role="group" aria-label="分组">${GROUPS.map(g => `<button data-lg="${g}" aria-pressed="${S.liveGroup === g}">${g}<em>${g === "全部" ? CH.length : CH.filter(c => c.g === g).length}</em></button>`).join("")}</div>
    <div class="guide" style="--chw:${chw}px"><div class="gscroll" id="gs"><div class="ginner" style="width:${chw + W}px">
      <div class="gruler"><div class="gcorner">${isM() ? "今天" : "今天 · 10月24日 周六"}</div><div class="gticks" style="width:${W}px">${ticks}</div></div>
      ${rows}<div class="gnow" style="left:${chw + (NOW - G0) * ppm}px"><span>${hm(NOW)}</span></div></div></div></div>
    <p class="hint">方向键在节目之间移动，回车看详情。正在播的节目底部的线是进度；频道左边的色条是「${esc(dev(S.mini)?.n || "")}」正在看的台。节目信息来自频道表的 EPG（每天更新），台标来自 M3U 的 tvg-logo。</p>`;
};
// 横向滚动时，被左边切掉一半的节目把标题挪到看得见的地方。
function pinTitles() {
  const gs = $("#gs"); if (!gs) return; const x = gs.scrollLeft;
  gs.querySelectorAll(".gp").forEach(b => { const l = b.offsetLeft, w = b.offsetWidth, pad = Math.max(12, Math.min(x - l + 12, w - 60)); b.style.paddingLeft = pad + "px"; });
}
function afterLive() { const gs = $("#gs"); if (!gs) return; gs.scrollLeft = (NOW - G0) * (isM() ? 3.2 : 5) - (isM() ? 60 : 140); pinTitles(); gs.addEventListener("scroll", () => requestAnimationFrame(pinTitles), { passive: true }); }

/* ============================== 小电视的频道表 ============================== */
VIEWS.lineup = () => {
  const ts = tvs();
  if (!ts.length) return emptyBox("tv", "还没有小电视", "频道表是小电视上按「上 / 下」换台时的那张表。绑定小电视后在这里排。", `<a class="btn pri" href="#/devices">绑定小电视</a>`);
  const d = ts.find(x => x.id === S.lu) || ts[0];
  const grp = (name, list, sub) => `<div class="lgrp"><header>${name}<small>${sub}</small></header>${list.map(([no, lg, nm, sm, tag, on]) => `<div class="lrow"><span class="grip" aria-hidden="true">⋮⋮</span><span class="no">${no}</span><span>${lg}</span><span class="nm">${esc(nm)}<small>${esc(sm)}</small></span><span class="tag">${tag}</span><button class="sw" role="switch" aria-checked="${on}" aria-label="在${esc(d.s)}小电视上显示 ${esc(nm)}" data-sw></button></div>`).join("")}</div>`;
  const chRows = g => CH.filter(c => c.g === g).map(c => [String(c.no).padStart(2, "0"), logo(c, 46), c.name, `现在：${c.pr[nowI(c)].n}`, "直播", c.id !== "cctv2"]);
  const upRows = UP.slice(0, 4).map((u, i) => [String(31 + i), avatar(u.n, u.hue, 34), u.n, `${u.site} · 最新 20 个视频轮播`, "UP 主", i < 3]);
  const srRows = SR.slice(0, 4).map((s, i) => [String(41 + i), avatar(s.t, s.hue, 34), s.t, `${s.k} · 看到第 ${s.at || 1} 集`, "剧集", true]);
  return `<div class="chips" role="group" aria-label="哪台小电视">${ts.map(x => `<button data-lu="${x.id}" aria-pressed="${x.id === d.id}"><span class="dot ${x.on ? "" : "off"}"></span>${esc(x.n)}</button>`).join("")}</div>
    <div class="lineup"><div>${grp("UP 主", upRows, "订阅的 UP 主，每个是一个台")}${grp("央视", chRows("央视"), "来自全站频道表")}${grp("卫视", chRows("卫视"), "")}${grp("动画影视", srRows, "剧集台，按顺序播")}${grp("港澳台", chRows("港澳台"), "")}</div>
    <div><div class="panel"><h3>${esc(d.n)}的频道表</h3><div class="meta">${d.model} · ${d.res}</div><div class="meter" role="meter" aria-valuemin="0" aria-valuemax="128" aria-valuenow="86" aria-label="已用台数"><i style="width:${86 / 128 * 100}%"></i></div>
      <div class="meta">86 / 128 个台 · 5.2 / 7 KB（小电视一次收得下的上限）</div><p class="hint">拖动 ⋮⋮ 调顺序；关掉的台小电视上不出现，电脑和手机上照样能看。</p></div>
    <div class="panel"><h3>直播源</h3>
      <div class="src">${ic("check", 18)}<span>全站频道表<small>管理员维护 · 214 个台 · 含 EPG</small></span></div>
      <div class="src">${ic("plus", 18)}<span>预设：央视卫视精简<small>40 个台 · 适合小屏</small></span><button class="btn sm">加入</button></div>
      <div class="src">${ic("plus", 18)}<span>预设：少儿动画<small>12 个台</small></span><button class="btn sm">加入</button></div>
      <div class="src">${ic("link", 18)}<span>自定义 M3U 链接<small>台标读 tvg-logo，节目单读 x-tvg-url</small></span><button class="btn sm">添加</button></div></div>
    <div class="panel"><h3>节目信息（EPG）</h3><div class="meta">上次更新 今天 18:00 · 覆盖 168 / 214 个台</div><p class="hint">没有 EPG 的台只显示台名，不显示「正在播」。</p></div></div></div>`;
};

/* ============================== UP 主 ============================== */

  const bili = blocked() ? [] : [[`《${q}》相关番剧 · 加为剧集`, "番剧 · B站 · 12 集", 260]].map(([t, s, h]) => ri(art(t, h, "w", { title: false }), mk(t), s, `data-sheet="add" data-kind="series"`, `<span class="tag">加为剧集</span>`));
  const ups = UP.filter(u => hit(u.n)).map(u => ri(avatar(u.n, u.hue, 52), mk(u.n), `${u.site} · ${u.fans} 粉丝 · 已订阅`, `data-up-go="${u.id}"`, "", "av"));
  if (!blocked()) ups.push(ri(avatar(q + "探索", 300, 52), `${mk(q)}探索频道`, "B站 · 3.1 万粉丝", `data-sheet="add" data-kind="up"`, `<span class="tag">订阅</span>`, "av"));
  const vids = UP.flatMap(u => u.v.map((v, i) => [u, v, i])).filter(([u, v]) => hit(v[0]) && !(blocked() && u.site === "B站")).map(([u, v, i]) => ri(itemArt(IT[`v:${u.id}:${i}`]), mk(v[0]), `${esc(u.n)} · ${v[1]} · ${v[2]}`, `data-play="v:${u.id}:${i}"`));
  if (!blocked()) [`用手机拍${q}空的 5 个技巧`, `${q}空露营一晚是什么体验`, `一口气看完《${q}河列车》前 8 集`].forEach((t, i) => vids.push(ri(art(t, 200 + i * 30, "w", { title: false }), mk(t), `B站 · ${["08:12", "15:40", "42:05"][i]} · ${["12 万", "3.4 万", "88 万"][i]}播放`, `data-play="v:ajxx:${i % 3}"`)));

/* ============================== 播放 ============================== */
let toastT;
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 2600); }
function play(id, to) {
  if (!IT[id]) return;
  if (S.ask && !to) { openTarget(id); return; }
  const tid = to || (dev(S.target) ? S.target : "pc"), d = dev(tid);
  if (!d || !d.on) { openTarget(id); toast(`${d ? d.n : "那台"}离线了，换一个地方`); return; }
  d.now = id; d.paused = false; S.mini = tid;
  if (S.remember) S.target = tid;
  if (S.sheet === "target") closeSheet();
  render(true);
  if (S.sheet === "remote") refreshRemote();
  toast(d.pc ? `在这台电脑上播放「${IT[id].title}」` : `已在${d.n}上播放「${IT[id].title}」`);
}
function remoteKey(k, devId) {
  const d = dev(devId); if (!d || !d.now) return;
  const it = IT[d.now];
  if (k === "pp") { d.paused = !d.paused; toast(d.paused ? `${d.n} 已暂停` : `${d.n} 继续播放`); }
  else if (k === "chup" || k === "chdn") {
    if (it.live) { const i = CH.findIndex(c => c.id === it.ch), j = (i + (k === "chdn" ? 1 : CH.length - 1)) % CH.length; d.now = "ch:" + CH[j].id; toast(`${d.n} 换到 ${CH[j].name}`); }
    else if (it.sr) { const e = Math.max(1, Math.min(srById(it.sr).upd, it.e + (k === "chdn" ? 1 : -1))); d.now = `ep:${it.sr}:${e}`; toast(`第 ${e} 集`); }
    else if (it.up) { const u = UP.find(x => x.id === it.up), i = +d.now.split(":")[2], j = (i + (k === "chdn" ? 1 : u.v.length - 1)) % u.v.length; d.now = `v:${u.id}:${j}`; toast(u.v[j][0]); }
  } else if (k === "next") { remoteKey("chdn", devId); return; }
  else if (k === "back" || k === "fwd") toast(k === "back" ? "退 30 秒" : "进 30 秒");
  const fk = focusKey(); renderMini(); restoreFocus(fk); refreshRemote();
  if (curRoute === "devices") render(true);
}
function goBack() { history.length > 1 ? history.back() : (location.hash = "#/home"); }

document.addEventListener("click", e => {

  const ds = t.dataset;
  if (t.id === "scrim") return;

  if (ds.view) { S.view = ds.view; applyView(); render(true); return; }
  if (ds.theme) { S.theme = ds.theme; applyTheme(); return; }
  if (ds.logo) { S.logo = ds.logo; $("#logosel").value = S.logo; render(true); toast(`顶栏换成候选 ${S.logo.toUpperCase()}`); return; }
  if (ds.tg) { if (t.getAttribute("aria-disabled") === "true") { toast("这台离线了"); return; } if (S.pending) { const p = S.pending; S.pending = null; S.target = S.remember ? ds.tg : S.target; play(p, ds.tg); } else { S.target = ds.tg; closeSheet(); render(true); toast(`以后播放到「${dev(ds.tg).n}」`); } return; }
  if (ds.play) { e.preventDefault(); play(ds.play, ds.to); return; }
  if (ds.sheet === "target") { openTarget(ds.item || null); return; }
  if (ds.sheet === "add") { openAdd(ds.kind); return; }
  if (ds.remote) { openRemote(ds.remote); return; }
  if (ds.rk) { const id = ds.mini !== undefined ? S.mini : (document.getElementById("rbody") || {}).dataset?.dev; remoteKey(ds.rk, id); return; }
  if (ds.rdev) { const rb = $("#rbody"); rb.dataset.dev = ds.rdev; refreshRemote(); return; }
  const rdev = () => dev((document.getElementById("rbody") || {}).dataset?.dev);
  if (ds.bri !== undefined) { rdev().bri = +ds.bri; refreshRemote(); return; }
  if (ds.sleep !== undefined) { const d = rdev(); d.sleep = +ds.sleep; refreshRemote(); toast(d.sleep ? `${d.n} ${d.sleep} 分钟后关` : "定时关已取消"); return; }
  if (ds.pet !== undefined) { rdev().pet = +ds.pet; refreshRemote(); return; }
  if (ds.listen !== undefined) { const d = rdev(); d.listen = !d.listen; refreshRemote(); renderMini(); toast(d.listen ? `${d.n} 只放声音` : `${d.n} 恢复画面`); return; }
  if (ds.remember !== undefined) { S.remember = !S.remember; S.ask = !S.remember; t.setAttribute("aria-checked", S.remember); return; }
  if (ds.sw !== undefined) { t.setAttribute("aria-checked", t.getAttribute("aria-checked") !== "true"); return; }
  if (ds.settarget) { S.target = ds.settarget; render(true); toast(`以后播放到「${dev(ds.settarget).n}」`); return; }
  if (ds.hero) { const n = empty() ? 1 : HERO.length; S.hero = (S.hero + +ds.hero + n) % n; render(true); return; }
  if (ds.heroI !== undefined) { S.hero = +ds.heroI; render(true); return; }
  if (ds.lg) { S.liveGroup = ds.lg; S.sel = null; render(true); return; }
  if (ds.sel) { const [ch, i] = ds.sel.split(":"); S.sel = { ch, i: +i }; $("#lhead").innerHTML = liveHead(); document.querySelectorAll(".gp").forEach(b => b.setAttribute("aria-pressed", String(b === t))); return; }
  if (ds.lu) { S.lu = ds.lu; render(true); return; }
  if (ds.sf) { S.sf = ds.sf; render(true); return; }
  if (ds.lt) { S.lt = ds.lt; render(true); return; }
  if (ds.up !== undefined && t.classList.contains("up")) { S.up = ds.up; render(true); return; }
  if (ds.upGo) { S.up = ds.upGo; location.hash = "#/up"; return; }

  if (ds.q) { S.q = ds.q; render(true); return; }
  if (ds.href) { location.hash = ds.href; return; }
  if (ds.back !== undefined) { goBack(); return; }
  if (ds.miniOpen !== undefined) { const it = IT[(dev(S.mini) || {}).now]; if (it) location.hash = it.live ? "#/live" : it.sr ? `#/detail/${it.sr}` : it.lib ? `#/detail/${it.lib}` : "#/up"; return; }

});

});
// 方向键：在屏幕上找那个方向最近的可聚焦元素（电视遥控器式的焦点引擎）。
const FOC = 'a[href], button:not([disabled]), input, select, [tabindex="0"]';
const vis = el => el.offsetParent !== null || getComputedStyle(el).position === "fixed";

  const row = h && cur.closest(".shelf, .ups");

  function pick(list) {

      if ((bc - rc) * sg <= 1) continue;                       // 中心必须往那个方向走了

// 货架横向滚到焦点卡片完整可见，页面纵向滚到这一排不被顶栏和播放条挡住（scroll-margin 定的边距）。

// 鼠标：卡片跟着指针轻微倾斜、反光点跟着走；指到一张卡片时把键盘焦点也挪过来，免得同时有两张浮起。
let tiltEl = null, pmEv = null, pmRaf = 0;
const resetTilt = a => ["--rx", "--ry", "--mx", "--my"].forEach(p => a.style.removeProperty(p));
function tilt() {
  pmRaf = 0; const e = pmEv; const a = e.target.closest ? e.target.closest(".card:not(:disabled) .art") : null;
  if (tiltEl && tiltEl !== a) resetTilt(tiltEl);
  tiltEl = a; if (!a || RM.matches) return;
  const r = a.getBoundingClientRect(), x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));

// 只认真的移动：页面重画后浏览器会对停着不动的指针补发 pointerover，那不能把键盘焦点抢走。
let lastXY = "";
document.addEventListener("pointermove", e => {

  pmEv = e; if (!pmRaf) pmRaf = requestAnimationFrame(tilt);
  const c = e.target.closest && e.target.closest("#view .card:not(:disabled)"), a = document.activeElement;

document.addEventListener("pointerleave", () => { if (tiltEl) { resetTilt(tiltEl); tiltEl = null; } });
$("#demo").addEventListener("change", e => { S.demo = e.target.value; if (!dev(S.target)) S.target = "pc"; if (!dev(S.mini)) S.mini = S.target; render(true); });
$("#logosel").addEventListener("change", e => { S.logo = e.target.value; render(true); });
addEventListener("hashchange", () => { if (S.sheet) closeSheet(); applyParams(parse().q); render(); });
addEventListener("resize", () => { const was = isM(); applyView(); if (was !== isM()) render(true); });
applyParams(parse().q);
if (S.demo === "notv") { S.target = "pc"; S.mini = "pc"; }
render();
</script>
