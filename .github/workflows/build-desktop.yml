name: Build desktop client

# The PC client (design docs/superpowers/specs/2026-10-19-pc-client-architecture-design.md,
# 5.2 and phase P2c): the tray plus the core in a macOS .app/DMG (Apple silicon
# and Intel), a Windows Inno Setup installer and portable zip, and a Linux
# tarball. The core is built here from packaging/desktop/rootv-core.spec
# (tools/build_core.py; its own checks are build-desktop-core.yml), with firmware
# for its /flash/ page.
#
# Pushes to desktop-* branches and manual runs build, test and package the
# release set (an artifact) and publish nothing: a dry run of the release. A tag
# push does the same with the tag's own firmware and version, then publishes the
# installers and SHA256SUMS-desktop into the tag's GitHub release, beside the
# firmware (build-firmware.yml) and the single-user server (build-server.yml).

on:
  push:
    branches:
      - "desktop-*"
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Run on a tag only: publish to that tag's release. Off (default): dry run, nothing is published"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The core's /flash/ page offers the firmware bundled with it. A tag build
  # takes the same release's firmware, which build-firmware.yml is building at
  # the same moment: this job waits for that release's xiaozhi-tv-flasher.zip
  # (and its version) instead of shipping a client whose flasher offers other
  # firmware than its release page. Elsewhere it takes the latest release's,
  # best effort. One download for the four platforms.
  firmware:
    name: Firmware for the flasher page
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Fetch and check the firmware bundle
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$TAG" ]; then
            python packaging/desktop/fetch_firmware.py --required --wait 3600 --expect-version "$TAG" \
              --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/xiaozhi-tv-flasher.zip"
          else
            python packaging/desktop/fetch_firmware.py
          fi

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-firmware
          path: packaging/desktop/firmware/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: ${{ matrix.label }}
    needs: firmware
    strategy:
      # One platform failing is a fact about that platform; the others still
      # answer whether the same change works there.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS arm64
            slug: macos-arm64
          # GitHub's Intel macOS runner (design Q6: two DMGs).
          - os: macos-15-intel
            label: macOS x86_64
            slug: macos-x86_64
          - os: windows-latest
            label: Windows x64
            slug: windows-x64
          # Older glibc for wider reach (design 5.2).
          - os: ubuntu-22.04
            label: Linux x86_64
            slug: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.3 pystray==0.19.5 pillow==13.0.0

      # The tray's own tests on the OS each branch of it is written for (locks,
      # registry, ctypes wrappers, paths).
      - name: Unit tests (desktop/)
        run: python packaging/desktop/unit_tests.py

      # The version the files are named after (desktop/__init__.py). On a tag it
      # must be the tag without its "v", and the core is stamped with it (a
      # checkout's core says "<version>.dev").
      - name: Version
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$TAG" ]; then
            python packaging/desktop/release.py version --tag "$TAG" --stamp
          else
            python packaging/desktop/release.py version
          fi

      # Absent when no release has a flasher bundle (not on a tag: the firmware
      # job requires it there). The client works without it; the data folder's
      # firmware/ is used.
      - name: Firmware for the flasher page
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: ${{ github.ref_type != 'tag' }}
        with:
          name: desktop-firmware
          path: packaging/desktop/firmware

      - name: Build the core
        run: python tools/build_core.py

      - name: Build
        run: python packaging/desktop/build.py --release --core-dir build-core/dist/rootv-core

      - name: Smoke test (bundle)
        run: python packaging/desktop/smoke.py

      # The real tray icon inside the frozen app (pystray + PyInstaller, design
      # section 15). Runners are not desktops: kept separate and allowed to fail
      # so it never hides the result of the steps above.
      - name: Tray icon check
        if: runner.os != 'Linux'
        continue-on-error: true
        run: python packaging/desktop/smoke.py --tray-check-only

      - name: Installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The vendored Chinese wizard texts (packaging/desktop/ChineseSimplified.isl)
          # are those of Inno Setup 6.7.1, the version on the runner image; a
          # different one still compiles (missing texts fall back to English) but
          # should get the matching file.
          $pinned = "6.7.1"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --version=$pinned -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { Write-Output "::error::Inno Setup is not available on this runner"; exit 1 }
          $keys = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1",
                  "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1"
          $installed = (Get-ItemProperty $keys -ErrorAction SilentlyContinue | Select-Object -First 1).DisplayVersion
          if ($installed -ne $pinned) {
            Write-Output "::warning::Inno Setup '$installed' on this runner; ChineseSimplified.isl is pinned to $pinned (packaging/desktop/ChineseSimplified-SOURCE.txt)"
          } else {
            Write-Output "::notice::Inno Setup $installed; wizard in Simplified Chinese (default) and English"
          }
          $version = python -c "import desktop; print(desktop.__version__)"
          $stage = Join-Path $PWD "build-desktop\stage\RooTV"
          $out = Join-Path $PWD "build-desktop"
          & $iscc "/DSourceDir=$stage" "/DAppVersion=$version" "/DOutputDir=$out" /Qp packaging\desktop\rootv.iss
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::ISCC failed with exit code $LASTEXITCODE"; exit 1 }
          $setup = Get-ChildItem build-desktop\RooTV-*-windows-x64-setup.exe | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          Add-Content -Path build-desktop\SHA256SUMS -Value "$hash  $($setup.Name)"
          Get-Content build-desktop\SHA256SUMS

      # The rename (RooTV, formerly Xiaozhi TV): the last Xiaozhi TV installer is
      # installed first, then this one over it. The old installation must be gone
      # (its uninstaller is run by rootv.iss), the new one in place, and the first
      # start of the new tray must move the old data folder.
      - name: Upgrade over Xiaozhi TV 0.2.5-beta
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $old = "XiaozhiTV-0.2.5-beta-windows-x64-setup.exe"
          gh release download v0.2.5-beta --repo rooma1989/ai-passport-tv --pattern $old --dir old-release
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "old-release\$old")) {
            Write-Output "::warning::could not download $old; upgrade test skipped"
            exit 0
          }
          $p = Start-Process -FilePath "old-release\$old" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          $oldDir = Join-Path $env:ProgramFiles "Xiaozhi TV"
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$oldDir\XiaozhiTV.exe")) { Write-Output "::error::old installer failed ($($p.ExitCode))"; exit 1 }
          # A household's data, as the old client leaves it.
          $legacy = Join-Path $env:LOCALAPPDATA "XiaozhiTV"
          New-Item -ItemType Directory -Force -Path "$legacy\run" | Out-Null
          Set-Content -Path "$legacy\upgrade-marker.txt" -Value "kept"
          $setup = Get-ChildItem build-desktop\RooTV-*-windows-x64-setup.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=upgrade.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Output "::error::upgrade install exited with $($p.ExitCode)"; Get-Content upgrade.log -Tail 40; exit 1 }
          $dir = Join-Path $env:ProgramFiles "RooTV"
          if (-not (Test-Path "$dir\RooTV.exe")) { Write-Output "::error::not installed in $dir"; exit 1 }
          if (Test-Path "$oldDir\XiaozhiTV.exe") { Write-Output "::error::the old installation is still in $oldDir"; Get-Content upgrade.log -Tail 40; exit 1 }
          $old = netsh advfirewall firewall show rule name="Xiaozhi TV" | Out-String
          if ($old -match "Profiles:") { Write-Output "::error::the old firewall rule is still there"; exit 1 }
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{6F1C2B7E-3D44-4A8E-9B1F-7A5C2E9D4B10}_is1"
          $name = (Get-ItemProperty $key -ErrorAction SilentlyContinue).DisplayName
          if ($name -ne "小鼠电视 RooTV") { Write-Output "::error::uninstall entry is '$name'"; exit 1 }
          # First start of the new tray (headless smoke test, default folders): moves the data.
          $t = Start-Process -FilePath "$dir\RooTV.exe" -ArgumentList "--smoke-test","--timeout","120" -Wait -PassThru
          $new = Join-Path $env:LOCALAPPDATA "RooTV"
          if (Test-Path "$new\logs\tray.log") { Get-Content "$new\logs\tray.log" -Tail 30 }
          if ($t.ExitCode -ne 0) { Write-Output "::error::first start after the upgrade failed ($($t.ExitCode))"; exit 1 }
          if (-not (Test-Path "$new\upgrade-marker.txt")) { Write-Output "::error::data folder not moved to $new"; exit 1 }
          if (-not (Test-Path "$legacy\MOVED-TO-RooTV.txt")) { Write-Output "::error::no MOVED-TO-RooTV.txt in $legacy"; exit 1 }
          Remove-Item -Recurse -Force $new, $legacy
          Write-Output "::notice::upgrade from Xiaozhi TV 0.2.5-beta: old installation removed, RooTV installed, data folder moved: PASS"
          exit 0

      - name: Install, smoke-test, uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem build-desktop\RooTV-*-windows-x64-setup.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Output "::error::installer exited with $($p.ExitCode)"; Get-Content install.log -Tail 40; exit 1 }
          $dir = Join-Path $env:ProgramFiles "RooTV"
          if (-not (Test-Path "$dir\RooTV.exe")) { Write-Output "::error::not installed in $dir"; exit 1 }
          # Firewall: one inbound rule for the core, Private profile only (design Q7).
          $rule = netsh advfirewall firewall show rule name="RooTV" verbose | Out-String
          Write-Output $rule
          if ($rule -notmatch "Profiles:\s+Private\s") { Write-Output "::error::firewall rule missing or not Private-only"; exit 1 }
          if ($rule -notmatch [regex]::Escape("$dir\core\rootv-core.exe")) { Write-Output "::error::firewall rule is not for the core program"; exit 1 }
          if ($rule -notmatch "Action:\s+Allow") { Write-Output "::error::firewall rule does not allow"; exit 1 }
          python packaging/desktop/smoke.py --program "$dir"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $u = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          # The uninstaller hands over to a copy of itself; wait for the files to go.
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\RooTV.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\RooTV.exe") { Write-Output "::error::uninstall left $dir\RooTV.exe (exit $($u.ExitCode))"; exit 1 }
          $after = netsh advfirewall firewall show rule name="RooTV" | Out-String
          if ($after -match "Profiles:") { Write-Output "::error::uninstall left the firewall rule"; exit 1 }
          Write-Output "::notice::Windows installer: install, firewall rule (Private only), smoke test of the installed copy, uninstall: PASS"
          # netsh's "no rule matches" above exits 1, and the runner would take
          # the last native exit code as the step's.
          exit 0

      - name: Upload (unsigned test build)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.slug }}
          path: |
            build-desktop/*.dmg
            build-desktop/*.zip
            build-desktop/*.exe
            build-desktop/*.tar.gz
            build-desktop/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7

  # Every platform's files, checked against the SHA256SUMS each was built with,
  # with one SHA256SUMS-desktop: the release set. Made on every run so a branch
  # push or a manual run shows exactly what a tag would publish.
  release-set:
    name: Release set
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Not merged: every platform's artifact has its own SHA256SUMS.
      - name: Download the platform builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          path: parts

      - name: Check and collect
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version="$(python3 packaging/desktop/release.py version ${TAG:+--tag "$TAG"})" || { echo "$version"; exit 1; }
          python3 packaging/desktop/release.py collect parts --out release --version "$version"
          ls -la release/
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::notice::dry run: release set for $version checked (see the desktop-release artifact); nothing published"
          fi

      - name: Upload the release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  release:
    # A tag push, or a manual run on a tag with "publish" ticked. Only after
    # every platform built and the set was checked: half a set of installers
    # would look complete and not be.
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
    needs: release-set
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The firmware and server workflows publish to the same release for the
    # same tag. A release is updated by reading it and writing it back, so two
    # jobs doing that at once lose one side's files; concurrency groups are
    # repository-wide, so the same group name makes them queue. cancel-in-progress
    # must stay false: cancelling a release job halfway is how a published
    # release ends up missing an asset.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      # Only for the release text, which the three workflows share.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: packaging/release

      - name: Download the release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-release
          path: release

      - name: List what will be published
        run: ls -la release/

      - name: Publish to the tag's release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "${{ github.ref_name }}"
          # The page a user lands on. One file read by the firmware, server and
          # desktop workflows, so whichever publishes last writes the same text.
          body_path: packaging/release/release-body.txt
          files: release/*
          fail_on_unmatched_files: true
