# Template: on the BT-panel host, install as
# /www/server/panel/vhost/nginx/extension/<site>/tv-relay.conf (included inside the site's server block).
# Proxies the phone remote to the relay's page port. Only that port is reachable
# from outside; the stream port stays loopback-only. Every request needs a session
# cookie or the key; access logs are off because sign-in links carry secrets.

# The remote: https://<site>/tv/ (page, API, manifest, icons).
location ^~ /tv/ {
    proxy_pass http://127.0.0.1:8100/;
    proxy_set_header Host $host;
    # Multi-user relay: the phone's address, kept only as a /24 (/48) prefix in its audit log.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 8k;
    access_log off;
}

# The device's QR code: https://<site>/TV/R/<code> signs a phone in.
location ^~ /TV/R/ {
    proxy_pass http://127.0.0.1:8100/r/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    access_log off;
}

# Multi-user relay (--db): an unbound device's QR code, https://<site>/TV/B/<claim>.
# The page it opens binds the device to the signed-in phone's account. Harmless
# with the single-user relay, which answers 404.
location ^~ /TV/B/ {
    proxy_pass http://127.0.0.1:8100/b/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    access_log off;
}

# The first page's address, kept so saved links still work (?k=<key> signs in).
location ^~ /TV/cast/ {
    proxy_pass http://127.0.0.1:8100/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 8k;
    access_log off;
}
