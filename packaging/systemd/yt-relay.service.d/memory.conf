# Install on the overseas host as /etc/systemd/system/yt-relay.service.d/memory.conf.
# yt-dlp with deno peaks near 330 MB alone; two ffmpeg streams on top overran
# 400M and the node was OOM-killed. The current yt-relay.service template already
# has MemoryMax=600M; this drop-in raises a base unit installed from an older
# template (400M) without replacing it.
[Service]
MemoryMax=600M
