<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1c1915">
<title>小智电视</title>
<style>
  :root { --ink: #1c1915; --ink-deep: #0f0d0b; --rule: #3a342b; --paper: #e6dcc8; --paper-hi: #efe5d0;
          --dim: #8c8170; --faint: #6e6455; --red: #d2553f; --amber: #ffb547;
          --serif: "Songti SC", "STSong", "Noto Serif SC", serif; --mono: "Menlo", "SF Mono", ui-monospace, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--paper); font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 32px 20px; }
  h1 { margin: 0 0 6px; font: 700 24px/1.3 var(--serif); letter-spacing: 3px; color: var(--paper-hi); }
  .tag { font-size: 12px; color: var(--red); letter-spacing: 3px; }
  p { font: 16px/1.7 var(--serif); }
  .dim { color: var(--dim); font-size: 14px; }
  .code { font: 600 20px/1.6 var(--mono); color: var(--amber); letter-spacing: 2px; word-break: break-all;
          background: var(--ink-deep); border: 1px solid var(--rule); padding: 10px 12px; margin: 12px 0; }
  input { width: 100%; background: var(--ink-deep); border: 1px solid var(--rule); color: var(--paper);
          font: 16px -apple-system, "PingFang SC", sans-serif; padding: 11px 12px; border-radius: 0; }
  button { display: block; width: 100%; margin-top: 14px; background: var(--red); color: #fff4e6; border: 0;
           padding: 12px; font: 17px var(--serif); letter-spacing: 4px; }
  button:disabled { opacity: .5; }
  a { color: var(--amber); }
  .bad { color: var(--red); }
  .warn { border-left: 2px solid var(--amber); padding: 6px 0 6px 12px; font-size: 15px; }
  label { display: block; margin: 16px 0 6px; color: var(--dim); font-size: 14px; }
  details { margin-top: 22px; color: var(--dim); font-size: 14px; }
  summary { cursor: pointer; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <div class="tag" id="tag">小智电视</div>
  <h1 id="title">正在打开…</h1>
  <div id="body"></div>
</main>
<script>
"use strict";
// 同一个页面服务三种链接：/TV/R/<码>（扫小电视的遥控码）、/TV/B/<码>（绑定；没登录时可以创建账号并绑定）、
// /tv/i/<码>（邀请）。
// 接口都在 /tv/ 下：登录的 cookie 只在那个路径下发送。
const parts = location.pathname.split("/").filter(Boolean);
const code = (parts[parts.length - 1] || "").toUpperCase();
const mode = (parts[parts.length - 2] || "").toLowerCase();
const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function show(title, ...nodes) {
  $("title").textContent = title;
  $("body").replaceChildren(...nodes);
}

async function api(method, path, body) {
  const options = { method, credentials: "same-origin", headers: {} };
  if (body !== undefined) {
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  const response = await fetch("/tv/" + path, options);
  if (response.status === 404) return null;
  return response.json();
}

// 20 位的码每 5 个一组；自建的 6 位数字绑定码 3 个一组（和小电视屏幕上一样）。
function grouped(text) { return /^[0-9]{6}$/.test(text) ? text.slice(0, 3) + " " + text.slice(3) : text.replace(/(.{5})(?=.)/g, "$1 "); }

async function scan() {
  const answer = await api("POST", "api/scan", { code });
  if (answer && answer.ok) { location.replace(answer.redirect); return; }
  show("打不开", el("p", "", answer ? answer.error : "这个二维码已经失效了。"));
}

function modelName(model) {
  return model === "ai-passport" ? "AI Passport" : model === "xingzhi-cube-154" ? "小智（方块）" : "小电视";
}

// 还没登录的手机扫了未绑定设备的码：在这里建账号（只问名字），这台手机就登录了，设备归新账号。
function register(info) {
  const name = el("input");
  name.placeholder = "你的名字（家里人看得懂就行）";
  name.maxLength = 20;
  name.value = "我";
  name.autocomplete = "off";
  const label = el("label", "", "怎么称呼你");
  const button = el("button", "", "创建账号并绑定这台设备");
  const note = el("p", "dim", "不用密码：这台手机会记住登录（180 天），打开后可以「添加到主屏幕」。" +
    "以后换了手机，在小电视的状态页上连按 5 下 OK，就能用新手机扫码「恢复登录」。");
  button.onclick = async () => {
    button.disabled = true;
    let answer = null;
    try { answer = await api("POST", "api/bind/register", { claim: code, name: name.value }); } catch (error) { answer = null; }
    if (!answer || !answer.ok) {
      button.disabled = false;
      note.className = "bad";
      note.textContent = answer ? answer.error : "网络不通，请稍后再试。";
      return;
    }
    location.replace(answer.redirect);
  };
  const other = el("details");
  other.append(el("summary", "", "已经有账号了？"),
    el("p", "dim", "从手机桌面上的「小智电视」图标打开遥控，在「订阅 → 我的设备」里输入这串绑定码（小电视屏幕上也写着）："),
    el("div", "code", grouped(code)));
  const nodes = [el("p", "", modelName(info.model) + " · 尾号 " + info.tail), label, name, button, note, other];
  // 微信里登录了也只在微信里有效，加不到桌面：先换到浏览器。
  if (/MicroMessenger/i.test(navigator.userAgent)) {
    nodes.unshift(el("p", "warn", "这是在微信里打开的。请点右上角「…」选「在浏览器打开」，在 Safari 里创建，才能放到桌面上。"));
  }
  show("这台小电视还没有主人", ...nodes);
}

async function bind() {
  const info = await api("GET", "api/bind/" + code);
  if (info && info.ok && info.register) { register(info); return; }
  if (!info) {
    show("绑定小电视",
      el("p", "", "这个浏览器还没有登录小智电视。请从手机桌面上的「小智电视」图标打开遥控，在「我的 → 绑定新设备」里输入下面的绑定码："),
      el("div", "code", grouped(code)),
      el("p", "dim", "小电视屏幕上也写着这串码。还没有账号的话，请先向管理员要一个邀请链接。"));
    return;
  }
  if (!info.ok) { show("绑定小电视", el("p", "bad", info.error)); return; }
  const button = el("button", "", "绑定到我的账号");
  const note = el("p", "dim", "绑定后，这台小电视只有你（和你扫码遥控的客人）能用，播的是你订阅的台。");
  button.onclick = async () => {
    button.disabled = true;
    const answer = await api("POST", "api/bind", { claim: code });
    if (!answer || !answer.ok) { button.disabled = false; note.className = "bad"; note.textContent = answer ? answer.error : "绑定失败"; return; }
    const open = el("a", "", "打开遥控");
    open.href = "/tv/";
    show("已绑定", el("p", "", "「" + answer.device.name + "」已经是你的了。小电视几秒后会换成你的频道。"), open);
  };
  show("绑定这台小电视？", el("p", "", modelName(info.model) + " · 尾号 " + info.tail), note, button);
}

async function invite() {
  const info = await api("GET", "api/invite/" + code);
  if (!info || !info.ok) { show("邀请无效", el("p", "", info ? info.error : "这个邀请已经用过或过期了。")); return; }
  const name = el("input");
  name.placeholder = "你的名字（家里人看得懂就行）";
  name.maxLength = 20;
  name.value = info.name || "";
  const button = el("button", "", "接受邀请");
  const note = el("p", "dim", "接受后这台手机就登录了。打开后可以「添加到主屏幕」，以后从图标进来。");
  button.onclick = async () => {
    button.disabled = true;
    const answer = await api("POST", "api/invite/accept", { code, name: name.value });
    if (!answer || !answer.ok) { button.disabled = false; note.className = "bad"; note.textContent = answer ? answer.error : "没成功"; return; }
    location.replace(answer.redirect);
  };
  show("你被邀请使用小智电视", el("p", "", "小智电视把网上的直播、UP 主和剧集放到桌上的小电视里。"), name, button, note);
}

(mode === "r" ? scan : mode === "b" ? bind : mode === "i" ? invite : async () => show("打不开"))()
  .catch(() => show("打不开", el("p", "", "网络不通，请稍后再试。")));
</script>
</body>
</html>
