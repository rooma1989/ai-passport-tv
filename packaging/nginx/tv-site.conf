# Template: the product website (packaging/site/) on its own host name, with the
# relay's pages reachable there the same way as on the main site.
# Replace <site> with the host name, <root> with the web root the site's files are
# copied to, and the certificate paths. On a BT-panel host the panel writes the
# server block itself; copy the locations below into it instead.
#
# <root> holds:
#   index.html, assets/   from packaging/site/
#   TV/index.html          from packaging/help/index.html (the help page)
# The relay's locations (/tv/, /TV/R/, /TV/B/, /TV/L/, /TV/W, /TV/cast/) come from
# tv-relay.conf; they are prefix matches with ^~ or exact matches, so they win over
# the static /TV/ help page below.

server {
    listen 80;
    listen [::]:80;
    server_name <site>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <site>;

    ssl_certificate     /etc/nginx/ssl/<site>/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/<site>/privkey.pem;

    root <root>;
    index index.html;
    charset utf-8;

    # The relay: phone remote and PC console (/tv/, /tv/console, /tv/wifi),
    # sign-in and binding QR codes (/TV/R/, /TV/B/, /TV/L/), sound setup (/TV/W).
    include /etc/nginx/snippets/tv-relay.conf;   # packaging/nginx/tv-relay.conf

    # The website. Static, no cookies, no third-party requests.
    location = / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
        try_files /index.html =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # The help page, /TV/ (packaging/help/index.html). Device QR codes point here.
    location = /TV/ {
        add_header Cache-Control "no-cache";
        try_files /TV/index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
