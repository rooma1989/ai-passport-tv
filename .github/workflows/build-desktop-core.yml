name: Build desktop core

# The PC client's core (docs/superpowers/specs/2026-10-19-pc-client-architecture-design.md,
# phase P1): the self-host supervisor and its children frozen as one PyInstaller onedir
# folder per platform, then started in --desktop mode and checked end to end by
# tools/smoke_test_core.py (control API, setup, console link, a simulated device, restart,
# stop, the tray's pipe, a hard kill leaving nothing behind, the pinned ffmpeg download).
# The tray and the installers (P2c) build on this folder; release packaging is theirs.

on:
  push:
    branches:
      - "desktop-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ${{ matrix.label }}
    strategy:
      # Every platform runs even if one fails: a failure is a fact about that platform.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS arm64
          - os: macos-15-intel
            label: macOS x86_64
          - os: windows-latest
            label: Windows x64
          # The oldest supported Ubuntu runner: an older glibc runs on more distributions.
          - os: ubuntu-22.04
            label: Linux x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.22.3"

      # The desktop-mode unit tests on every platform: the Windows branches of the supervisor,
      # the lock and the control API are only ever exercised here.
      - name: Desktop unit tests
        run: python -m unittest tests.test_selfhost_desktop -v

      - name: Build the core (onedir)
        run: python tools/build_core.py --archive

      - name: Smoke test the frozen core
        run: |
          core=build-core/dist/xiaozhi-tv-core/xiaozhi-tv-core
          if [ "$RUNNER_OS" = "Windows" ]; then core="$core.exe"; fi
          python tools/smoke_test_core.py --core "$core" --ffmpeg fetch

      - name: Upload the core
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xiaozhi-tv-core-${{ matrix.os }}
          path: build-core/xiaozhi-tv-core-*.zip
          if-no-files-found: error
          retention-days: 14
