# Multi-user media server (phase 1): identify devices by id and secret, and
# serve each with its own files under devices/<id>/. Install the same file for
# BOTH media units, as
#   /etc/systemd/system/tv-xingzhi.service.d/tenancy.conf
#   /etc/systemd/system/tv-passport.service.d/tenancy.conf
# then `systemctl daemon-reload`. Deleting it (and daemon-reload) is the
# rollback. Old firmware keeps working: the unit's pairing token is mapped to
# the legacy device migrated for its port (8098 Xingzhi, 8097 Passport).
# Steps: docs/development/tenancy-phase1-runbook.md.
[Service]
Environment=TV_DB=/var/lib/ai-passport-tv/tv.db
Environment=TV_DEVICES_DIR=/var/lib/ai-passport-tv/devices
# The database's WAL files and the devices/ directory live here; the Passport
# unit's own data directory is elsewhere, so it needs this line too.
ReadWritePaths=/var/lib/ai-passport-tv
