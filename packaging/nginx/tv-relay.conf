# Template: on the BT-panel host, install as
# /www/server/panel/vhost/nginx/extension/<site>/tv-relay.conf (included inside the site's server block).
# Proxies the creator-channel page to the relay's page port. Only that port is reachable
# from outside; the stream port stays loopback-only. Every request needs the key.
location ^~ /TV/cast/ {
    proxy_pass http://127.0.0.1:8100/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 8k;
    access_log off;
}
