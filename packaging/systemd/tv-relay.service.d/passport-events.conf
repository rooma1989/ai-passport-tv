# Install as /etc/systemd/system/tv-relay.service.d/passport-events.conf.
# Single-user relay: it writes each --extra-device's now-playing and events files,
# and the Passport's live in that unit's own data directory. One ReadWritePaths=
# line per extra device whose files are outside /var/lib/ai-passport-tv.
# Harmless after the tenancy cut-over (tenancy.conf drops --extra-device).
[Service]
ReadWritePaths=/var/lib/ai-passport-tv-passport
