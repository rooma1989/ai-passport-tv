# Template: on the BT-panel host, install as
# /www/server/panel/vhost/nginx/extension/<site>/tv-listen.conf next to tv-relay.conf,
# for every host name that serves the phone remote (the main site and the
# product website's). Included inside the site's server block.
#
# "Listening on the phone" (docs/superpowers/specs/2026-10-12-phone-audio-design.md):
# the phone remote plays the device's sound as an HLS audio stream from the media
# server that serves the device. Each media server listens on loopback only
# (TV_LISTEN_PORT in its listen.conf drop-in); the relay hands the phone an address
# /tv/listen/<route>/<device>/live.m3u8?t=<token>, where <route> is the media
# server's TV_LISTEN_ROUTE. These prefixes are longer than tv-relay.conf's
# "location ^~ /tv/", so they win. The token is in the address (the player does not
# reliably send cookies), so access logs stay off, as for the rest of /tv/.
# The clock the page aligns to is the relay's /tv/api/listen/time (covered by /tv/).

# Xingzhi Cube media server (tv-xingzhi.service, TV_LISTEN_PORT=8198).
location ^~ /tv/listen/xingzhi/ {
    proxy_pass http://127.0.0.1:8198/listen/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 30s;
    # The playlist is fetched about once a second by every listening phone.
    gzip on;
    gzip_types application/vnd.apple.mpegurl;
    access_log off;
}

# AI Passport media server (tv-passport.service, TV_LISTEN_PORT=8199).
location ^~ /tv/listen/passport/ {
    proxy_pass http://127.0.0.1:8199/listen/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 30s;
    gzip on;
    gzip_types application/vnd.apple.mpegurl;
    access_log off;
}
