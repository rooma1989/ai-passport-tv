# Install as /etc/systemd/system/tv-passport.service.d/listen.conf.
# "Listening on the phone" (docs/superpowers/specs/2026-10-12-phone-audio-design.md):
# a loopback-only HTTP port for the phone's HLS audio stream, reached through
# nginx at /tv/listen/passport/ (packaging/nginx/tv-listen.conf). Deleting this
# file (and daemon-reload, restart) turns the feature off for this unit: the
# remote then hides its "用手机听" row.
# The stream and its ffmpeg exist only while a phone listens (one per device),
# and stop 20 s after the last phone stops fetching.
[Service]
Environment=TV_LISTEN_PORT=8199
Environment=TV_LISTEN_ROUTE=passport
# The token secret is derived from the relay's key (the relay derives the same
# one from its --key-file), so there is no new secret to deploy. Its own
# variable rather than voice.conf's TV_RELAY_KEY_FILE, so voice stays as it is.
Environment=TV_LISTEN_KEY_FILE=/etc/ai-passport-tv/relay-key
# Single-user relay only: this unit's device id in the relay (d1 is the first --extra-device).
# Ignored once tenancy.conf sets TV_DB: the device is the one each session admits.
Environment=TV_LISTEN_DEVICE=d1
# While someone listens the device plays H (5 s) behind the phone, so the
# channel queues hold H more of the programme; room for bursty live sources.
Environment=TV_PCM_QUEUE_CHUNKS=600
Environment=TV_VIDEO_QUEUE_S=24
