<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1c1915">
<!-- 原型不发任何网络请求：CSP 只许内联样式、内联脚本和 data: 图片。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>小智电视 · 家庭媒体中心（原型）</title>
<style>
/* 设计原型（docs/superpowers/specs/2026-10-24-media-center-ui-design.md）。颜色和字体沿用 console.html / remote.html，
   只把 --dim / --faint 调亮了一档（小字对比度够 4.5:1）。所有封面、台标都是 SVG 画的占位图，数据是假的。 */
:root {
  --ink: #1c1915; --ink-deep: #0f0d0b; --side: #161310; --card: #25211b; --card-hi: #302a22; --rule: #3a342b; --rule-hi: #5a5042;
  --paper: #e6dcc8; --paper-hi: #f2e9d6; --dim: #a19580; --faint: #857a68; --red: #d2553f; --red-hi: #e46a52;
  --amber: #ffb547; --amber-soft: #f3dfb4; --r: 6px;
  --serif: "Songti SC", "STSong", "Noto Serif SC", serif;
  --mono: "Menlo", "SF Mono", ui-monospace, monospace;
  --sans: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #0b0a08; color: var(--paper); font: 15px/1.5 var(--sans); }
button, select, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: default; opacity: .45; }
a { color: inherit; text-decoration: none; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 4px; }
[hidden] { display: none !important; }
svg { display: block; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---- 舞台：桌面铺满；「手机」时套一个 390×844 的框 ---- */
#stage { height: 100vh; display: flex; }
#stage.framed { align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #2a241d, #0b0a08 70%); }
#app { position: relative; flex: 1; height: 100vh; overflow: hidden; background: var(--ink);
       display: grid; grid-template-columns: 224px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
#stage.framed #app { flex: none; width: 410px; height: 864px; border: 10px solid #050403; border-radius: 48px;
                     box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px #3a342b; }

/* ---- 原型选项（不是产品的一部分） ---- */
#proto { position: fixed; z-index: 50; left: 12px; bottom: 12px; width: 200px; padding: 10px 12px; border: 1px dashed var(--rule-hi);
         background: rgba(15,13,11,.92); border-radius: 8px; font-size: 12px; color: var(--dim); display: grid; gap: 8px; }
#proto b { color: var(--amber); font: 12px var(--mono); letter-spacing: 1px; }
#proto .seg { display: flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
#proto .seg button { flex: 1; padding: 5px 0; text-align: center; color: var(--dim); }
#proto .seg button[aria-pressed=true] { background: var(--paper-hi); color: var(--ink); }
#proto select { width: 100%; background: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 5px; color: var(--paper); }
#stage.framed ~ #proto, #proto.framed { left: 24px; top: 24px; bottom: auto; }
#proto.mhide { display: none; }

/* ---- 侧边导航 ---- */
#side { grid-row: 1 / 3; background: var(--side); border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 22px 22px 14px; }
.brand b { display: block; font: 700 22px/1 var(--serif); letter-spacing: 4px; color: var(--paper-hi); }
.brand span { display: block; margin-top: 8px; font-size: 11px; color: var(--red); letter-spacing: 3px; }
#nav { flex: 1; overflow-y: auto; padding: 6px 10px 150px; }
#nav a { display: flex; align-items: center; gap: 12px; padding: 9px 12px; margin: 2px 0; border-radius: var(--r);
         color: var(--dim); font: 16px var(--serif); letter-spacing: 1px; }
#nav a:hover { background: var(--card); color: var(--paper-hi); }
#nav a[aria-current=page] { background: var(--card-hi); color: var(--paper-hi); box-shadow: inset 3px 0 0 var(--red); }
#nav a em { margin-left: auto; font: 11px var(--mono); font-style: normal; color: var(--ink); background: var(--amber); border-radius: 9px; padding: 0 6px; }
#nav .sep { height: 1px; background: var(--rule); margin: 8px 12px; }

/* ---- 主区和顶栏 ---- */
#main { min-width: 0; min-height: 0; overflow-y: auto; overflow-x: hidden; }
.top { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 14px; padding: 14px 32px 12px;
       background: linear-gradient(var(--ink) 75%, rgba(28,25,21,0)); }
.top h1 { margin: 0; font: 600 22px var(--serif); letter-spacing: 3px; color: var(--paper-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; color: var(--paper); }
.iconbtn:hover { background: var(--card); }
.sbox { flex: 1; max-width: 400px; margin-left: 12px; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px;
        background: var(--card); border: 1px solid var(--rule); border-radius: 999px; color: var(--dim); }
.sbox input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--paper-hi); }
.sbox kbd { font: 11px var(--mono); color: var(--faint); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; }
.sbox:focus-within { border-color: var(--rule-hi); }
.tchip { margin-left: auto; flex: none; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px 0 12px; border: 1px solid var(--rule);
         border-radius: 999px; color: var(--paper-hi); font: 14px var(--serif); white-space: nowrap; }
.tchip:hover { border-color: var(--rule-hi); background: var(--card); }
.tchip small { color: var(--dim); font: 12px var(--sans); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--amber); box-shadow: 0 0 6px rgba(255,181,71,.6); }
.dot.off { background: var(--faint); box-shadow: none; }
.me { width: 34px; height: 34px; flex: none; border-radius: 50%; background: #5b3a2e; color: var(--paper-hi); display: grid; place-items: center; font: 600 15px var(--serif); }
#view { padding: 0 32px 40px; }

/* ---- 通用 ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: var(--r); white-space: nowrap;
       background: var(--card-hi); border: 1px solid var(--rule); color: var(--paper-hi); font: 16px var(--serif); letter-spacing: 1px; }
.btn:hover { border-color: var(--rule-hi); }
.btn.pri { background: var(--red); border-color: var(--red); color: #fff4e6; }
.btn.pri:hover { background: var(--red-hi); }
.btn small { font: 12px var(--sans); letter-spacing: 0; opacity: .85; }
.btn.sm { height: 34px; padding: 0 12px; font-size: 14px; }
.btn.ghost { background: none; }
.split { display: inline-flex; }
.split .btn:first-child { border-radius: var(--r) 0 0 var(--r); }
.split .btn.caret { border-radius: 0 var(--r) var(--r) 0; padding: 0 10px; border-left: 1px solid rgba(15,13,11,.35); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 18px; }
.chips button, .chips a { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--rule); color: var(--dim); font: 14px var(--serif); display: inline-flex; align-items: center; gap: 6px; }
.chips button:hover, .chips a:hover { color: var(--paper-hi); border-color: var(--rule-hi); }
.chips [aria-pressed=true] { background: var(--paper-hi); border-color: var(--paper-hi); color: var(--ink); }
.chips em { font: 11px var(--mono); font-style: normal; opacity: .7; }
.hint { color: var(--faint); font-size: 12px; margin: 8px 0 0; }
.mono { font-family: var(--mono); }
.h2 { display: flex; align-items: baseline; gap: 12px; margin: 30px 0 12px; }
.h2 h2 { margin: 0; font: 600 19px var(--serif); letter-spacing: 2px; color: var(--paper-hi); }
.h2 small { color: var(--faint); font-size: 12px; }
.h2 .more { margin-left: auto; color: var(--dim); font-size: 13px; }
.h2 .more:hover { color: var(--paper-hi); }
.banner { display: flex; gap: 14px; align-items: center; margin: 4px 0 18px; padding: 14px 18px; border-radius: 8px; border: 1px solid var(--rule); background: var(--card); }
.banner.warn { border-color: #6b3b2c; background: #2b1d17; }
.banner b { display: block; font: 600 16px var(--serif); color: var(--paper-hi); }
.banner p { margin: 2px 0 0; font-size: 13px; color: var(--dim); }
.banner .btn { margin-left: auto; }
.banner .ico { color: var(--amber); flex: none; }
.banner.warn .ico { color: var(--red); }
.empty { text-align: center; padding: 56px 20px; border: 1px dashed var(--rule); border-radius: 10px; color: var(--dim); }
.empty b { display: block; margin: 14px 0 6px; font: 600 20px var(--serif); color: var(--paper-hi); letter-spacing: 2px; }
.empty p { margin: 0 auto 18px; max-width: 420px; font-size: 14px; }
.empty svg { margin: 0 auto; color: var(--faint); }

/* ---- 卡片和货架 ---- */
.shelf { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x proximity; padding: 4px 4px 12px; margin: 0 -4px; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
.shelf > * { flex: none; scroll-snap-align: start; }
.card { display: block; width: 252px; text-align: left; }
.card.p { width: 150px; }
.card .art { position: relative; display: block; width: 100%; border-radius: var(--r); overflow: hidden; aspect-ratio: 16 / 9; background: var(--card); transition: transform .15s, box-shadow .15s; }
.card.p .art { aspect-ratio: 2 / 3; }
.card .art > svg { width: 100%; height: 100%; }
.card:hover .art, .card:focus-visible .art { transform: translateY(-2px); box-shadow: 0 0 0 2px var(--rule-hi), 0 10px 24px rgba(0,0,0,.4); }
.card:focus-visible { outline: none; }
.card:focus-visible .art { box-shadow: 0 0 0 3px var(--amber), 0 10px 24px rgba(0,0,0,.4); }
.card .t { display: block; margin-top: 8px; font: 15px/1.35 var(--serif); color: var(--paper-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .s { display: block; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .s2 { display: block; font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(15,13,11,.6); }
.pbar i { display: block; height: 100%; background: var(--red); }
.badge { position: absolute; top: 8px; left: 8px; font: 11px/1 var(--sans); padding: 4px 6px; border-radius: 3px; background: rgba(15,13,11,.8); color: var(--paper-hi); }
.badge.r { left: auto; right: 8px; }
.badge.live { background: var(--red); color: #fff4e6; }
.badge.new { background: var(--amber); color: var(--ink); }
.badge.b { bottom: 10px; top: auto; }
.logo-on { position: absolute; left: 8px; bottom: 10px; width: 52px; }
.playov { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .15s; background: rgba(15,13,11,.25); }
.playov span { width: 46px; height: 46px; border-radius: 50%; background: rgba(15,13,11,.7); display: grid; place-items: center; color: var(--paper-hi); box-shadow: 0 0 0 1px rgba(242,233,214,.4); }
.card:hover .playov, .card:focus-visible .playov { opacity: 1; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 24px 16px; }
.pgrid .card, .wgrid .card { width: auto; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px 16px; }
.onb { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.onb a { display: block; padding: 20px; border: 1px dashed var(--rule-hi); border-radius: 10px; }
.onb a:hover { background: var(--card); }
.onb b { display: flex; align-items: center; gap: 8px; font: 600 17px var(--serif); color: var(--paper-hi); }
.onb p { margin: 6px 0 0; font-size: 13px; color: var(--dim); }

/* ---- 首页大图 ---- */
.hero { position: relative; height: 360px; border-radius: 12px; overflow: hidden; margin-top: 4px; }
.hero .bg { position: absolute; inset: 0; }
.hero .bg svg { width: 100%; height: 100%; }
.hero .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(15,13,11,.94) 0, rgba(15,13,11,.6) 42%, rgba(15,13,11,0) 72%), linear-gradient(0deg, rgba(15,13,11,.6), transparent 40%); }
.hero .copy { position: absolute; left: 40px; bottom: 34px; max-width: 480px; }
.kicker { font-size: 12px; letter-spacing: 3px; color: var(--red); display: flex; align-items: center; gap: 8px; }
.kicker .badge { position: static; }
.hero h2 { margin: 8px 0 6px; font: 700 40px/1.15 var(--serif); letter-spacing: 5px; color: var(--paper-hi); }
.meta { font-size: 13px; color: var(--dim); }
.syn { margin: 10px 0 0; font: 15px/1.7 var(--serif); color: var(--paper); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.hero .nav { position: absolute; right: 22px; bottom: 26px; display: flex; gap: 8px; align-items: center; }
.hero .nav button.dotb { width: 8px; height: 8px; border-radius: 50%; background: rgba(242,233,214,.35); }
.hero .nav button.dotb[aria-current=true] { background: var(--paper-hi); width: 22px; border-radius: 4px; }
.hero .nav .iconbtn { background: rgba(15,13,11,.5); }
.qchips { display: none; }

/* ---- 直播：上面是选中的节目，下面是节目单网格 ---- */
.lhead { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 28px; align-items: center; margin: 4px 0 18px; }
.lprev { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: var(--card); }
.lprev > svg { width: 100%; height: 100%; }
.lprev .logo-on { width: 64px; left: 12px; top: 12px; bottom: auto; }
.linfo .ch { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 13px; }
.linfo .ch b { font: 600 13px var(--mono); color: var(--amber); }
.linfo h2 { margin: 6px 0 4px; font: 700 28px/1.3 var(--serif); letter-spacing: 2px; color: var(--paper-hi); }
.lprog { display: flex; align-items: center; gap: 10px; margin: 10px 0 4px; font: 12px var(--mono); color: var(--dim); max-width: 460px; }
.lprog .trk { flex: 1; height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.lprog .trk i { display: block; height: 100%; background: var(--red); }
.lnext { font-size: 13px; color: var(--dim); }
.lnext b { color: var(--paper); font-weight: normal; font-family: var(--serif); }
.guide { border: 1px solid var(--rule); border-radius: 10px; background: var(--ink-deep); overflow: hidden; }
.gscroll { overflow: auto; max-height: 560px; position: relative; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
.ginner { position: relative; }
.grow { display: flex; height: 62px; border-bottom: 1px solid #241f19; }
.gch { position: sticky; left: 0; z-index: 3; flex: none; width: var(--chw); display: flex; align-items: center; gap: 10px; padding: 0 12px;
       background: var(--side); border-right: 1px solid var(--rule); }
.gch .no { font: 600 12px var(--mono); color: var(--amber); width: 18px; }
.gch .lg { width: 46px; flex: none; }
.gch span { font: 14px var(--serif); color: var(--paper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gch.cur { box-shadow: inset 3px 0 0 var(--red); }
.gprogs { position: relative; flex: none; }
.gp { position: absolute; top: 5px; bottom: 5px; padding: 6px 10px; border-radius: 5px; background: var(--card); border: 1px solid #2f2922; overflow: hidden; text-align: left; }
.gp b { display: block; font: 14px/1.3 var(--serif); font-weight: normal; color: var(--paper-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gp small { display: block; font: 11px var(--mono); color: var(--faint); }
.gp:hover { background: var(--card-hi); border-color: var(--rule-hi); }
.gp.now { background: #33241c; border-color: #5c3628; }
.gp.now small { color: var(--amber); }
.gp.past { opacity: .5; }
.gp .gpb { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--red); }
.gp[aria-pressed=true] { box-shadow: inset 0 0 0 2px var(--amber); }
.gp:focus-visible { outline-offset: -2px; }
.gruler { position: sticky; top: 0; z-index: 4; display: flex; height: 34px; background: var(--side); border-bottom: 1px solid var(--rule); }
.gcorner { position: sticky; left: 0; z-index: 5; flex: none; width: var(--chw); padding: 8px 12px; font-size: 12px; color: var(--dim); background: var(--side); border-right: 1px solid var(--rule); }
.gticks { position: relative; flex: none; }
.gticks span { position: absolute; top: 8px; font: 12px var(--mono); color: var(--dim); padding-left: 6px; border-left: 1px solid var(--rule); height: 26px; }
.gnow { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--red); z-index: 2; pointer-events: none; }
.gnow span { position: sticky; top: 6px; display: block; width: 44px; margin-left: -22px; padding: 2px 0; text-align: center; border-radius: 3px; background: var(--red); color: #fff4e6; font: 11px var(--mono); z-index: 6; }

/* ---- 节目单（小电视的频道表） ---- */
.lineup { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
.lgrp { border: 1px solid var(--rule); border-radius: 10px; margin-bottom: 14px; overflow: hidden; background: var(--ink-deep); }
.lgrp > header { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px; background: var(--side); font: 600 16px var(--serif); color: var(--paper-hi); }
.lgrp > header small { font: 12px var(--sans); color: var(--faint); }
.lrow { display: grid; grid-template-columns: 22px 34px 52px minmax(0, 1fr) auto 52px; gap: 12px; align-items: center; padding: 8px 14px; border-top: 1px solid #241f19; }
.lrow .grip { color: var(--faint); cursor: grab; letter-spacing: -2px; }
.lrow .no { font: 600 13px var(--mono); color: var(--amber); }
.lrow .nm { font: 15px var(--serif); color: var(--paper-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .nm small { display: block; font: 12px var(--sans); color: var(--dim); }
.tag { font-size: 11px; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--rule); color: var(--dim); white-space: nowrap; }
.sw { width: 46px; height: 26px; border-radius: 13px; background: var(--rule); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); transition: left .15s; }
.sw[aria-checked=true] { background: var(--red); }
.sw[aria-checked=true]::after { left: 23px; background: #fff4e6; }
.panel { border: 1px solid var(--rule); border-radius: 10px; padding: 16px; background: var(--ink-deep); margin-bottom: 14px; }
.panel h3 { margin: 0 0 10px; font: 600 16px var(--serif); color: var(--paper-hi); }
.meter { height: 8px; border-radius: 4px; background: var(--rule); overflow: hidden; margin: 8px 0 4px; }
.meter i { display: block; height: 100%; background: var(--amber); }
.src { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid #241f19; font-size: 14px; }
.src:first-of-type { border-top: 0; }
.src span { flex: 1; min-width: 0; }
.src small { display: block; color: var(--faint); font-size: 12px; }

/* ---- 详情 ---- */
.dhero { position: relative; margin: -64px -32px 0; padding: 92px 32px 30px; overflow: hidden; }
.dhero .bg { position: absolute; inset: -40px; filter: blur(30px) saturate(1.2); opacity: .55; }
.dhero .bg svg { width: 100%; height: 100%; }
.dhero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(28,25,21,.35), var(--ink) 92%); }
.dbody { position: relative; z-index: 1; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 34px; align-items: end; }
.dbody .dposter { grid-row: 1 / 3; }
.dbody .wide { grid-column: 2; }
.dposter { border-radius: 8px; overflow: hidden; aspect-ratio: 2 / 3; box-shadow: 0 24px 60px rgba(0,0,0,.55); }
.dposter.w { aspect-ratio: 16 / 9; }
.dposter svg { width: 100%; height: 100%; }
.dbody h2 { margin: 8px 0 6px; font: 700 40px/1.2 var(--serif); letter-spacing: 5px; color: var(--paper-hi); }
.dbody .syn { -webkit-line-clamp: 3; max-width: 640px; }
.lastw { margin-top: 12px; font-size: 13px; color: var(--dim); }
.lastw b { color: var(--amber); font: 13px var(--mono); }
.facts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.eps { display: grid; gap: 4px; }
.ep { display: grid; grid-template-columns: 176px minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 10px; border-radius: 10px; text-align: left; width: 100%; }
.ep:hover { background: var(--card); }
.ep.cur { background: var(--card-hi); }
.ep .art { position: relative; aspect-ratio: 16 / 9; border-radius: 5px; overflow: hidden; }
.ep .art svg { width: 100%; height: 100%; }

<div id="stage">

    <div id="main">

      <div id="view"></div>

// 横向滚动时，被左边切掉一半的节目把标题挪到看得见的地方（像 Plex 的节目单）。
function pinTitles() {
  const gs = $("#gs"); if (!gs) return; const x = gs.scrollLeft;
  gs.querySelectorAll(".gp").forEach(b => { const l = b.offsetLeft, w = b.offsetWidth, pad = Math.max(10, Math.min(x - l + 10, w - 60)); b.style.paddingLeft = pad + "px"; });
}
function afterLive() { const gs = $("#gs"); if (!gs) return; gs.scrollLeft = (NOW - G0) * (isM() ? 3.2 : 5) - (isM() ? 60 : 140); pinTitles(); gs.addEventListener("scroll", () => requestAnimationFrame(pinTitles), { passive: true }); }

  const SC = ["全部", "直播", "剧集番剧", "UP 主", "视频", "片库"];
  let o = `<label class="bigsearch">${ic("search", 22)}<input id="bigq" type="search" value="${esc(S.q)}" placeholder="搜直播、剧集、番剧、UP 主、B 站视频、片库" aria-label="搜索" autocomplete="off"></label>
    <div class="chips" role="group" aria-label="范围">${SC.map(s => `<button data-scope="${s}" aria-pressed="${S.scope === s}">${s}</button>`).join("")}</div>`;
  if (!q) return o + `<div class="h2"><h2>最近搜过</h2></div><div class="chips">${["星河", "番茄牛腩", "中超", "宝宝"].map(s => `<button data-q="${s}">${ic("hist", 16)}${s}</button>`).join("")}</div>`;

  const sec = (name, scope, rows) => (S.scope === "全部" || S.scope === scope) && rows.length ? `<div class="h2"><h2>${name}</h2><small>${rows.length} 个</small></div><div class="rlist">${rows.join("")}</div>` : "";
  const ri = (artH, t, sub, attrs, side = "") => `<button class="ritem" ${attrs}><span class="art">${artH}</span><span><b>${t}</b><span>${sub}</span></span>${side}</button>`;
  const live = []; CH.forEach(c => c.pr.forEach((p, i) => { if ((hit(p.n) || hit(c.name)) && p.e > NOW) live.push(ri(`${art(p.n, c.h, "w", { title: false })}<span class="logo-on" style="width:36px;bottom:6px;left:6px">${logo(c, 36)}</span>`, mk(p.n), `${esc(c.name)} · ${p.s <= NOW ? "正在播" : "今天 " + hm(p.s)}`, `data-play="ch:${c.id}"`)); }));
  const srs = SR.filter(s => hit(s.t) || s.tags.some(hit)).map(s => ri(art(s.t, s.hue, "w"), mk(s.t), `${s.k} · ${s.site} · ${s.at ? `看到第 ${s.at} 集` : `${s.n} 集`}`, `data-href="#/detail/${s.id}"`));
  const bili = blocked() ? [] : [[`《${q}》相关番剧 · 加为剧集`, "番剧 · B站 · 12 集", 260]].map(([t, s, h]) => ri(art(t, h, "w", { title: false }), mk(t), s, `data-sheet="add" data-kind="series"`, `<span class="btn sm ghost">加为剧集</span>`));
  const ups = UP.filter(u => hit(u.n)).map(u => `<button class="ritem" data-up-go="${u.id}"><span class="art" style="background:none;display:grid;place-items:center">${avatar(u.n, u.hue, 46)}</span><span><b>${mk(u.n)}</b><span>${u.site} · ${u.fans} 粉丝 · 已订阅</span></span></button>`);
  if (!blocked()) ups.push(`<button class="ritem" data-sheet="add" data-kind="up"><span class="art" style="background:none;display:grid;place-items:center">${avatar(q + "探索", 300, 46)}</span><span><b>${mk(q)}探索频道</b><span>B站 · 3.1 万粉丝</span></span><span class="btn sm ghost">订阅</span></button>`);
  const vids = UP.flatMap(u => u.v.map((v, i) => [u, v, i])).filter(([u, v]) => hit(v[0]) && !(blocked() && u.site === "B站")).map(([u, v, i]) => ri(itemArt(IT[`v:${u.id}:${i}`]), mk(v[0]), `${esc(u.n)} · ${v[1]} · ${v[2]}`, `data-play="v:${u.id}:${i}"`));
  if (!blocked()) [`用手机拍${q}空的 5 个技巧`, `${q}空露营一晚是什么体验`, `一口气看完《${q}河列车》前 8 集`].forEach((t, i) => vids.push(ri(art(t, 200 + i * 30, "w", { title: false }), mk(t), `B站 · ${["08:12", "15:40", "42:05"][i]} · ${["12 万", "3.4 万", "88 万"][i]}播放`, `data-play="v:ajxx:${i % 3}"`)));

  return o + (body || `<div class="empty"><b>没找到「${esc(q)}」</b><p>换个说法试试；B 站和 YouTube 的结果要能连上才有。</p></div>`);

function play(id, to) {

function remoteKey(k, devId) {

  const it = IT[d.now];

  else if (k === "chup" || k === "chdn") {
    if (it.live) { const i = CH.findIndex(c => c.id === it.ch), j = (i + (k === "chdn" ? 1 : CH.length - 1)) % CH.length; d.now = "ch:" + CH[j].id; toast(`${d.n} 换到 ${CH[j].name}`); }
    else if (it.sr) { const e = Math.max(1, Math.min(srById(it.sr).upd, it.e + (k === "chdn" ? 1 : -1))); d.now = `ep:${it.sr}:${e}`; toast(`第 ${e} 集`); }
