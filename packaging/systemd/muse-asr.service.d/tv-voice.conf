# Install as /etc/systemd/system/muse-asr.service.d/tv-voice.conf.
# muse-asr.service itself comes from the muse-gadget-sdk repository
# (esp32/tools/muse_asr); this drop-in adds the local socket the TV media servers
# use for voice control (TV_ASR_SOCKET in tv-*.service.d/voice.conf).
# The socket is mode 0660, owner museasr, group tvserver: that group is the only
# credential, no key is shared. Check:
#   sudo -u tvserver curl --unix-socket /run/muse-asr/asr.sock http://x/health
[Service]
Environment=MUSE_ASR_SOCKET=/run/muse-asr/asr.sock
Environment=MUSE_ASR_SOCKET_GROUP=tvserver
RuntimeDirectory=muse-asr
RuntimeDirectoryMode=0755
SupplementaryGroups=tvserver
